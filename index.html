/* ╔═══════════════════════════════════════════════════════════════════╗
   ║  11 · MOTOR DE CONVERSAÇÃO                                        ║
   ║  Máquina de estados. O estado decide o que perguntar em seguida;  ║
   ║  a intenção decide se saímos do trilho para responder algo.       ║
   ╚═══════════════════════════════════════════════════════════════════╝ */
const ESTADOS = {
  INICIO:'inicio',
  APRESENTACAO:'apresentacao',
  DESCOBERTA:'descoberta',
  QUALIFICACAO:'qualificacao',
  DEMONSTRACAO:'demonstracao',
  CONVITE:'convite',
  ENCERRAMENTO:'encerramento'
};

const Motor = (() => {

  const ctx = {
    estado: ESTADOS.INICIO,
    turnos: 0,
    falhasSeguidas: 0,
    aguardando: null,          // o que a última pergunta esperava
    pediuContato: false,
    mostrouDiagnostico: false,
    mostrouModulos: false,
    ofereceuResumo: false,
    ultimoUsoNome: -9,         // turno em que o nome foi dito pela última vez
    dados:{ nome:null, empresa:null, segmento:null, problema:null, usuarios:null, urgencia:null, ferramentas:null }
  };

  /* ── FAQ direto: intenções que têm resposta pronta ──────────────── */
  const MAPA_FAQ = {
    preco:'preco', prazo:'prazo', garantia:'garantia', suportepos:'suporte',
    hospedagem:'hospedagem', implantacao:'implantacao', atualizacoes:'atualizacoes',
    integracoes:'integracoes', treinamento:'treinamento', licenciamento:'licenciamento',
    ehIA:'ehIA', privacidade:'privacidade', empresa:'empresa', servicos:'empresa',
    ryan:'ryan', contato:'contato',
    quemSou:'quemSou', capacidades:'capacidades', comofunciona:'comofunciona',
    marketing:'marketing', manutencao:'manutencao', demo:'demo', migracao:'migracao'
  };

  /* ── intenções que indicam interesse em um tipo de solução ──────── */
  const INTERESSE = ['sistema','site','automacao','crm','erp','dashboard','ia','app','estoque','financeiro'];

  /* ── conversa natural ───────────────────────────────────────────── */

  /**
   * Devolve o nome só de vez em quando. Chamar a pessoa pelo nome em
   * toda frase soa decorado; usar nunca desperdiça o que ela contou.
   */
  function nomeParaFala(){
    const n = ctx.dados.nome;
    if(!n) return null;
    if(ctx.turnos - ctx.ultimoUsoNome < 3) return null;
    if(Math.random() > 0.6) return null;
    ctx.ultimoUsoNome = ctx.turnos;
    return n;
  }

  /** Espelha o cumprimento do visitante; se ele não disse, usa o relógio. */
  function periodoDaFala(texto){
    const t = U.normalizar(texto);
    if(/\bbom dia\b/.test(t))   return 'Bom dia';
    if(/\bboa tarde\b/.test(t)) return 'Boa tarde';
    if(/\bboa noite\b/.test(t)) return 'Boa noite';
    return U.periodoDoDia();
  }

  /** "Boa noite" abre conversa no começo e encerra no fim. */
  function ehDespedidaDisfarcada(texto){
    const t = U.normalizar(texto);
    return /\bboa noite\b/.test(t) && ctx.turnos > 3 && t.split(' ').length <= 3;
  }

  /**
   * Nunca deixa a conversa morrer: depois de qualquer gentileza,
   * devolve a próxima pergunta que ainda falta na descoberta.
   */
  function seguirConversa(saida){
    if(!ctx.dados.segmento){
      saida.falas.push('Me conta: em qual ramo você atua? Assim eu já consigo ser bem mais útil 😊');
      ctx.aguardando = 'segmento';
      ctx.estado = ESTADOS.DESCOBERTA;
      saida.chips = chipsSegmentos();
      return;
    }
    if(!ctx.dados.problema){
      saida.falas.push(Redator.falar('perguntaDor'));
      ctx.aguardando = 'dor';
      ctx.estado = ESTADOS.QUALIFICACAO;
      return;
    }
    if(!ctx.dados.usuarios){
      saida.falas.push(Redator.falar('perguntaEquipe'));
      ctx.aguardando = 'equipe';
      ctx.estado = ESTADOS.QUALIFICACAO;
      return;
    }
    if(REGRAS.podeOferecerResumo(ctx) && !ctx.ofereceuResumo){
      saida.falas.push(Redator.falar('conviteResumo'));
      ctx.ofereceuResumo = true;
      ctx.aguardando = 'resumo';
      saida.chips.push({ rotulo:'Sim, monta o resumo', icone:'📄', acao:'resumo', destaque:true });
      return;
    }
    saida.falas.push('Tem mais alguma coisa da sua operação que você queira me contar?');
  }

  /**
   * Processa um turno.
   * @returns {{falas:string[], cartoes:object[], chips:object[]}}
   */
  function processar(texto){
    ctx.turnos++;
    const saida = { falas:[], cartoes:[], chips:[] };

    const intencao = MotorIntencoes.detectar(texto, ctx);
    const segmento = MotorIntencoes.detectarSegmento(texto);
    const extraido = Extrator.processar(texto, ctx.dados);

    // "bom dia, quanto custa um sistema?" merece o bom dia de volta
    if(ctx.turnos <= 2 && MotorIntencoes.temCumprimento(texto)
       && (extraido.nome || (intencao.id !== 'saudacao' && intencao.id !== 'cortesia'))){
      cumprimentoPendente = periodoDaFala(texto) + '!';
    }

    Object.assign(ctx.dados, extraido);
    // afirmação explícita substitui um ramo detectado antes: o visitante
    // tem sempre a última palavra sobre o próprio negócio
    const afirmouRamo = /\b(tenho|trabalho com|trabalho na|trabalho no|sou dono|minha empresa|meu negocio|abri)\b/.test(U.corrigir(texto));
    if(segmento && (!ctx.dados.segmento || afirmouRamo)) ctx.dados.segmento = segmento;

    Analytics.evento('intencao', { id:intencao.id, confianca:Math.round(intencao.confianca) });
    if(segmento) Analytics.marco('segmento_identificado', { segmento:segmento.id });

    /* ── 1. bloqueios e prioridades absolutas ─────────────────────── */
    if(intencao.id === 'extracao'){
      Analytics.evento('bloqueio_extracao');
      saida.falas.push(REGRAS.bloquearExtracao());
      return finalizar(saida);
    }
    if(intencao.id === 'sensivel'){
      saida.falas.push(Redator.falar('dadoSensivel'));
      return finalizar(saida);
    }
    if(intencao.id === 'suporte'){
      Analytics.marco('cliente_suporte');
      saida.falas.push(Redator.falar('clienteSuporte'));
      saida.chips.push({ rotulo:'Abrir WhatsApp', icone:'💬', acao:'whatsapp_direto', destaque:true });
      return finalizar(saida);
    }
    if(intencao.id === 'reclamacao'){
      Analytics.marco('reclamacao');
      saida.falas.push(Redator.faq('reclamacao'));
      saida.chips.push({ rotulo:'Falar com o Ryan', icone:'💬', acao:'whatsapp_direto', destaque:true });
      return finalizar(saida);
    }
    if(intencao.id === 'grosseria'){
      Analytics.evento('grosseria');
      saida.falas.push(Redator.falar('grosseria'));
      saida.chips.push({ rotulo:'Falar com o Ryan', icone:'💬', acao:'whatsapp_direto' });
      return finalizar(saida);
    }
    // Filtro de escopo: a IA representa a BHSAAS, não é assistente geral.
    if(intencao.id === 'foratema'){
      Analytics.evento('fora_do_escopo');
      saida.falas.push(Redator.falar('foraDoEscopo'));
      saida.chips = chipsSegmentos();
      return finalizar(saida);
    }

    /* ── 2. pedido explícito de contato (Regra 10) ────────────────── */
    if(REGRAS.contatoSempreLiberado(intencao.id)){
      ctx.pediuContato = true;
      return rotaWhatsApp(saida);
    }

    /* ── 3. despedida e agradecimento ─────────────────────────────── */
    if(intencao.id === 'despedida' || (intencao.id === 'saudacao' && ehDespedidaDisfarcada(texto))){
      ctx.estado = ESTADOS.ENCERRAMENTO;
      Analytics.marco('conversa_encerrada');
      saida.falas.push(Redator.falar('despedida'));
      Avatar.humor('waving', 2600);
      return finalizar(saida);
    }
    if(intencao.id === 'agradecimento'){
      Avatar.humor('thanking', 2200);
      saida.falas.push(Redator.falar('agradecimento'));
      if(REGRAS.podeOferecerWhatsApp(ctx)) saida.chips.push(chipFalarComRyan());
      else seguirConversa(saida);
      return finalizar(saida);
    }

    /* ── 3b. cortesia: apresentação, cumprimento e elogio ──────────── */
    // Nome dito e nada de substancial na frase: recebe e segue o assunto.
    if(extraido.nome && intencao.confianca < 3){
      Avatar.humor('happy', 2200);
      Analytics.marco('visitante_se_apresentou');
      ctx.ultimoUsoNome = ctx.turnos;
      saida.falas.push(Redator.falar('apresentouNome', { nome:extraido.nome }));
      seguirConversa(saida);
      return finalizar(saida);
    }
    if(extraido.nome){
      Analytics.marco('visitante_se_apresentou');
      ctx.ultimoUsoNome = ctx.turnos;
      saida.falas.push('Prazer, ' + extraido.nome + '! 😊');
    }

    if(intencao.id === 'saudacao'){
      Avatar.humor('waving', 2600);
      saida.falas.push(Redator.falar('saudacaoNoMeio', { periodo:periodoDaFala(texto) }));
      seguirConversa(saida);
      return finalizar(saida);
    }

    if(intencao.id === 'cortesia'){
      Avatar.humor('happy', 2200);
      saida.falas.push(Redator.falar('cortesia'));
      seguirConversa(saida);
      return finalizar(saida);
    }

    if(intencao.id === 'elogio'){
      Avatar.humor('cheering', 2600);
      saida.falas.push(Redator.falar('elogio'));
      seguirConversa(saida);
      if(REGRAS.podeOferecerWhatsApp(ctx)) saida.chips.push(chipFalarComRyan());
      return finalizar(saida);
    }

    /* ── 4. FAQ ───────────────────────────────────────────────────── */
    if(MAPA_FAQ[intencao.id]){
      saida.falas.push(Redator.faq(MAPA_FAQ[intencao.id]));

      // preço tem um encaminhamento próprio, mas só se já houver contexto
      if(intencao.id === 'preco' && REGRAS.podeOferecerResumo(ctx)){
        saida.falas.push(FAQ.preco.seguirCom);
        saida.chips.push({ rotulo:'Montar meu resumo', icone:'📄', acao:'resumo', destaque:true });
      } else if(intencao.id === 'preco'){
        // ainda cedo: puxa a conversa para entender antes
        saida.falas.push(Redator.falar('perguntaProcessoAtual'));
        ctx.aguardando = 'processo';
      }
      return finalizar(saida);
    }

    /* ── 4b. assunto reconhecido, dado inexistente ─────────────────── */
    const semDado = SEM_DADO.find(g => g.id === intencao.id);
    if(semDado){
      Analytics.evento('assunto_sem_dado', { id:semDado.id });
      saida.falas.push(semDado.fala);
      if(REGRAS.podeOferecerWhatsApp(ctx)) saida.chips.push(chipFalarComRyan());
      else seguirConversa(saida);
      return finalizar(saida);
    }

    /* ── 5. resposta a uma pergunta pendente ──────────────────────── */
    if(ctx.aguardando){
      const tratado = responderPendencia(texto, intencao, saida);
      if(tratado) return finalizar(saida);
    }

    /* ── 6. avanço pela máquina de estados ────────────────────────── */
    if(intencao.id === 'pesquisando'){
      saida.falas.push(Redator.falar('pesquisando'));
      ctx.estado = ESTADOS.DESCOBERTA;
      ctx.aguardando = 'segmento';
      return finalizar(saida);
    }

    if(segmento){
      Avatar.humor('happy', 2000);
      saida.falas.push(Redator.falar('reconheceuSegmento', { segmento:segmento.nome.toLowerCase(), Segmento:segmento.nome }));
      saida.falas.push(Redator.falar('perguntaProcessoAtual'));
      ctx.estado = ESTADOS.DESCOBERTA;
      ctx.aguardando = 'processo';
      return finalizar(saida);
    }

    if(INTERESSE.includes(intencao.id)){
      Avatar.humor('happy', 2000);
      saida.falas.push(falaDeInteresse(intencao.id));
      if(!ctx.dados.segmento){
        saida.falas.push('Me conta em qual ramo você atua? Assim eu consigo ser bem mais útil.');
        ctx.aguardando = 'segmento';
        saida.chips = chipsSegmentos();
      } else {
        saida.falas.push(Redator.falar('perguntaDor'));
        ctx.aguardando = 'dor';
      }
      ctx.estado = ESTADOS.DESCOBERTA;
      return finalizar(saida);
    }

    if(intencao.id === 'planilha'){
      ctx.dados.ferramentas = ctx.dados.ferramentas || ['planilha'];
      saida.falas.push(Redator.falar('reagiuPlanilha'));
      saida.falas.push(Redator.falar('perguntaDor'));
      ctx.aguardando = 'dor';
      ctx.estado = ESTADOS.DESCOBERTA;
      return finalizar(saida);
    }

    /* ── 6b. sem intenção clara, mas com conteúdo aproveitável ─────
       Antes daqui, qualquer frase fora do vocabulário virava "não
       entendi". Se já sabemos o ramo, uma frase inteira quase sempre
       está falando do problema — desistir dela é jogar fora contexto. */
    const rendeu = Object.keys(extraido).length > 0;
    const substancial = U.corrigir(texto).trim().split(' ').length >= 3;

    if(rendeu || (ctx.dados.segmento && substancial)){
      Avatar.humor('curious', 1800);
      if(!ctx.dados.problema && substancial){
        ctx.dados.problema = texto.slice(0,180);
        saida.falas.push(Redator.falar('reagiuDor'));
      } else {
        saida.falas.push(Redator.falar('anotado'));
      }
      ctx.estado = ESTADOS.QUALIFICACAO;
      seguirConversa(saida);
      return finalizar(saida);
    }

    /* ── 7. não entendeu ──────────────────────────────────────────── */
    ctx.falhasSeguidas++;
    Analytics.evento('nao_entendeu', { falhas:ctx.falhasSeguidas });

    if(ctx.falhasSeguidas >= CFG.fluxo.maxFalhasSeguidas){
      saida.falas.push(Redator.falar('naoEntendiInsistente'));
      saida.chips.push({ rotulo:'Abrir WhatsApp', icone:'💬', acao:'whatsapp_direto', destaque:true });
    } else {
      saida.falas.push(Redator.falar('naoEntendi'));
      // na segunda falha, mostra o que ela dá conta em vez de só pedir de novo
      if(ctx.falhasSeguidas === 2) saida.falas.push(Redator.falar('menuAjuda'));
      saida.chips = chipsSegmentos();
    }
    return finalizar(saida);
  }

  /* ── tratamento de perguntas pendentes ──────────────────────────── */
  function responderPendencia(texto, intencao, saida){
    const pendencia = ctx.aguardando;

    if(pendencia === 'processo'){
      const ferramentas = Extrator.ferramentaAtual(texto);
      if(ferramentas){
        ctx.dados.ferramentas = ferramentas;
        saida.falas.push(Redator.falar('reagiuPlanilha'));
      } else {
        saida.falas.push(Redator.falar('reagiuDor'));
      }
      ctx.dados.problema = ctx.dados.problema || texto.slice(0,180);
      saida.falas.push(Redator.falar('perguntaDor'));
      ctx.aguardando = 'dor';
      ctx.estado = ESTADOS.QUALIFICACAO;
      return true;
    }

    if(pendencia === 'dor'){
      ctx.dados.problema = texto.slice(0,180);
      Avatar.humor('curious', 1800);
      saida.falas.push(Redator.falar('reagiuDor'));
      saida.falas.push(Redator.falar('perguntaEquipe'));
      ctx.aguardando = 'equipe';
      ctx.estado = ESTADOS.QUALIFICACAO;
      return true;
    }

    if(pendencia === 'equipe'){
      const n = Extrator.usuarios(texto) || parseInt(U.normalizar(texto).match(/\b(\d{1,4})\b/)?.[1] || '', 10);
      if(n) ctx.dados.usuarios = n;
      ctx.aguardando = null;
      return demonstrar(saida);
    }

    if(pendencia === 'resumo'){
      ctx.aguardando = null;
      if(intencao.id === 'sim') return montarResumo(saida);
      saida.falas.push('Sem problema 😊 Se mudar de ideia, é só pedir.');
      return true;
    }

    if(pendencia === 'segmento'){
      // não achou segmento na fala; deixa seguir para o fluxo normal
      ctx.aguardando = null;
      return false;
    }

    ctx.aguardando = null;
    return false;
  }

  /* ── etapa de demonstração: diagnóstico + módulos ───────────────── */
  function demonstrar(saida){
    const seg = ctx.dados.segmento;
    ctx.estado = ESTADOS.DEMONSTRACAO;

    if(!seg){
      saida.falas.push('Entendi. Em qual ramo você atua? Com isso eu consigo te mostrar exemplos bem mais concretos.');
      ctx.aguardando = 'segmento';
      saida.chips = chipsSegmentos();
      return true;
    }

    saida.falas.push('Deixa eu te mostrar o que costuma aparecer em ' + seg.nome.toLowerCase() + '.');

    if(!ctx.mostrouDiagnostico){
      ctx.mostrouDiagnostico = true;
      Analytics.marco('diagnostico_mostrado', { segmento:seg.id });
      saida.cartoes.push({ tipo:'diagnostico', segmento:seg });
    }

    saida.chips.push({ rotulo:'Ver caminhos possíveis', icone:'🧭', acao:'modulos', destaque:true });
    saida.chips.push({ rotulo:'Meu caso é diferente', icone:'💬', diz:'Meu caso é um pouco diferente disso.' });
    return true;
  }

  /* ── cartão de módulos ──────────────────────────────────────────── */
  function mostrarModulos(){
    const saida = { falas:[], cartoes:[], chips:[] };
    const seg = ctx.dados.segmento;
    if(!seg || ctx.mostrouModulos) return saida;

    ctx.mostrouModulos = true;
    ctx.estado = ESTADOS.CONVITE;
    Analytics.marco('caminhos_vistos', { segmento:seg.id });

    saida.cartoes.push({ tipo:'modulos', segmento:seg });
    saida.falas.push(Redator.falar('conviteResumo'));
    ctx.ofereceuResumo = true;
    ctx.aguardando = 'resumo';
    saida.chips.push({ rotulo:'Sim, monta o resumo', icone:'📄', acao:'resumo', destaque:true });
    saida.chips.push({ rotulo:'Falar com o Ryan', icone:'💬', acao:'whatsapp_direto' });
    return saida;
  }

  /* ── resumo + link de WhatsApp ──────────────────────────────────── */
  function montarResumo(saida){
    const d = ctx.dados;
    const seg = d.segmento;
    ctx.estado = ESTADOS.CONVITE;
    Analytics.marco('resumo_gerado');

    const vazio = 'Não informado';
    const linhas = [
      'RESUMO DO PROJETO',
      '',
      'Nome: '        + (d.nome || vazio),
      'Empresa: '     + (d.empresa || vazio),
      'Segmento: '    + (seg ? seg.nome : vazio),
      'Situação hoje: '+ (d.ferramentas ? d.ferramentas.join(', ') : vazio),
      'Problema: '    + (d.problema || vazio),
      'Usuários: '    + (d.usuarios ? d.usuarios + ' pessoas' : vazio),
      'Urgência: '    + (d.urgencia || vazio),
      '',
      'CAMINHOS LEVANTADOS',
      ...(seg ? seg.modulos.map(m => '- ' + m.t + ': ' + m.d) : ['- ' + vazio]),
      '',
      'PRÓXIMO PASSO',
      'Conversar com o Ryan para análise e proposta.'
    ];

    saida.cartoes.push({ tipo:'resumo', texto:linhas.join('\n') });
    saida.falas.push(Redator.falar('conviteWhatsapp'));
    saida.falas.push('Preparei também a mensagem para você mandar a ele — é só apertar enviar. Quem envia é você, eu não mando nada por aqui.');
    saida.cartoes.push({ tipo:'whatsapp', url:linkWhatsApp() });
    Avatar.humor('celebrating', 2800);
    Analytics.marco('link_whatsapp_gerado');
    return true;
  }

  /* ── rota direta ao WhatsApp ────────────────────────────────────── */
  function rotaWhatsApp(saida){
    saida.falas.push(Redator.faq('contato'));
    if(REGRAS.podeOferecerResumo(ctx) && !ctx.mostrouModulos){
      saida.falas.push('Se quiser, antes eu organizo um resumo do que conversamos. Chega bem mais redondo nele.');
      saida.chips.push({ rotulo:'Montar resumo antes', icone:'📄', acao:'resumo' });
    }
    saida.cartoes.push({ tipo:'whatsapp', url:linkWhatsApp() });
    Analytics.marco('link_whatsapp_gerado');
    return finalizar(saida);
  }

  /**
   * Monta o link do WhatsApp.
   * encodeURIComponent resolve a codificação que antes era uma
   * tabela de instruções — aqui é impossível errar.
   */
  function linkWhatsApp(){
    const d = ctx.dados;
    const vazio = 'Não informado';
    const msg = [
      'Olá, Ryan!','',
      'Vim pelo site e conversei com a IA da BHSAAS.','',
      'Nome: '      + (d.nome || vazio),
      'Empresa: '   + (d.empresa || vazio),
      'Segmento: '  + (d.segmento ? d.segmento.nome : vazio),
      'Objetivo: '  + (d.problema || vazio),
      'Usuários: '  + (d.usuarios ? d.usuarios + ' pessoas' : vazio),
      '',
      'Obrigado!'
    ].join('\n');

    return 'https://wa.me/' + CFG.whatsapp + '?text=' + encodeURIComponent(msg);
  }

  /* ── falas por tipo de interesse ────────────────────────────────── */
  function falaDeInteresse(id){
    const mapa = {
      sistema:'Sistema sob medida é o coração do que a BHSAAS faz.',
      site:'Site a gente faz — institucional, landing page, o que fizer sentido.',
      automacao:'Automação costuma ser o que dá retorno mais rápido, porque devolve tempo todo dia.',
      crm:'CRM organiza justamente a parte que mais escapa: o acompanhamento do cliente.',
      erp:'ERP é um nome grande que muda bastante de empresa para empresa.',
      dashboard:'Painel é ótimo quando a informação existe mas está espalhada.',
      ia:'IA a gente trabalha, sim — normalmente aplicada a um processo específico da empresa.',
      app:'Aplicativo eu não consigo confirmar se entra no escopo. Prefiro que o Ryan te responda isso direito.',
      estoque:'Controle de estoque é dos pedidos mais comuns por aqui.',
      financeiro:'Controle financeiro organiza o que costuma doer mais no fim do mês.'
    };
    return REGRAS.validarFala(mapa[id] || Redator.falar('naoSei'));
  }

  /* ── chips de segmento para destravar quem não sabe o que dizer ── */
  function chipsSegmentos(){
    return SEGMENTOS.slice(0,6).map(s => ({
      rotulo:s.nome, icone:s.icone, diz:'Tenho ' + (/^[aeiou]/i.test(s.nome) ? 'uma ' : 'um ') + s.nome.toLowerCase() + '.'
    }));
  }

  function chipFalarComRyan(){
    return { rotulo:'Falar com o Ryan', icone:'💬', acao:'whatsapp_direto' };
  }

  /* ── fechamento do turno ────────────────────────────────────────── */
  let cumprimentoPendente = null;

  function finalizar(saida){
    if(cumprimentoPendente && saida.falas.length){
      saida.falas.unshift(cumprimentoPendente);
      cumprimentoPendente = null;
    }
    if(saida.falas.length) ctx.falhasSeguidas = 0;
    saida.falas = saida.falas.filter(Boolean).map(REGRAS.validarFala);
    return saida;
  }

  /* ── ações vindas de chips ──────────────────────────────────────── */
  function acao(nome){
    const saida = { falas:[], cartoes:[], chips:[] };
    if(nome === 'modulos') return mostrarModulos();
    if(nome === 'resumo'){ montarResumo(saida); return saida; }
    if(nome === 'whatsapp_direto'){ ctx.pediuContato = true; return rotaWhatsApp(saida); }
    return saida;
  }

  // o redator pergunta ao motor quando pode chamar a pessoa pelo nome
  Redator.usarNome(nomeParaFala);

  return {
    processar, acao, ctx,
    chipsSegmentos,
    linkWhats: linkWhatsApp,
    podeChamarRyan: () => REGRAS.podeOferecerWhatsApp(ctx),
    saudacao: () => Redator.falar('saudacaoInicial', { periodo:U.periodoDoDia() })
  };
})();

const UI = (() => {
  const el = {
    thread:U.$('thread'), chips:U.$('chips'),
    input:U.$('input'), send:U.$('send'), status:U.$('status')
  };

  const ICONE_WA = '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2Zm5.6 14.2c-.2.7-1.2 1.3-2 1.4-.5.1-1.2.1-3.5-.8-2.9-1.2-4.7-4.2-4.9-4.4-.1-.2-1.1-1.5-1.1-2.8 0-1.4.7-2 .9-2.3.2-.3.5-.4.7-.4h.5c.2 0 .4 0 .6.5l.8 2c.1.2 0 .4-.1.5l-.3.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.2.1.4.1.6-.1l.7-.9c.2-.2.3-.2.6-.1l2 .9c.2.1.4.2.4.3.1.2.1.7-.1 1.3Z"/></svg>';

  const perto  = () => el.thread.scrollHeight - el.thread.scrollTop - el.thread.clientHeight < 110;
  const descer = f => { if(f || perto()) el.thread.scrollTop = el.thread.scrollHeight; };

  function turno(papel, texto){
    const wrap = document.createElement('div');
    wrap.className = 'turn ' + (papel === 'user' ? 'me' : 'ia');
    if(papel !== 'user'){
      const lbl = document.createElement('div');
      lbl.className = 'label';
      lbl.innerHTML = '<b></b> ' + CFG.nome;
      wrap.appendChild(lbl);
    }
    const say = document.createElement('div');
    say.className = 'say';
    say.textContent = texto;
    wrap.appendChild(say);
    el.thread.appendChild(wrap);
    descer(true);
    return say;
  }

  /** revelação palavra a palavra, com a boca do avatar acompanhando */
  function revelar(texto, alvo){
    return new Promise(resolve => {
      if(U.reduzido){ alvo.textContent = texto; descer(true); return resolve(); }
      Avatar.setBase('speaking');
      const palavras = texto.split(/(\s+)/);
      let i = 0;
      (function passo(){
        i += 1 + Math.floor(Math.random()*2);
        if(i >= palavras.length){ alvo.textContent = texto; descer(); return resolve(); }
        alvo.textContent = palavras.slice(0,i).join('');
        descer();
        setTimeout(passo, CFG.ritmo.msPorPalavra);
      })();
    });
  }

  const FALAS_ANALISE = ['Analisando seu cenário...','Conectando as informações...','Organizando as oportunidades...'];
  let timerAnalise = null;

  function analise(ligar){
    const atual = U.$('analise');
    if(!ligar){ clearInterval(timerAnalise); atual?.remove(); return; }
    if(atual) return;
    const box = document.createElement('div');
    box.className = 'analysis';
    box.id = 'analise';
    box.innerHTML =
      '<svg class="mesh" viewBox="0 0 66 52" aria-hidden="true">' +
      '<line x1="14" y1="14" x2="34" y2="10"/><line x1="34" y1="10" x2="54" y2="20"/>' +
      '<line x1="14" y1="14" x2="24" y2="38"/><line x1="24" y1="38" x2="50" y2="40"/>' +
      '<rect x="7" y="7" width="14" height="14" rx="4"/><rect x="27" y="3" width="14" height="14" rx="4"/>' +
      '<rect x="47" y="13" width="14" height="14" rx="4"/><rect x="17" y="31" width="14" height="14" rx="4"/>' +
      '<rect x="43" y="33" width="14" height="14" rx="4"/></svg>' +
      '<span class="say-what">' + FALAS_ANALISE[0] + '</span>';
    el.thread.appendChild(box);
    descer(true);

    let i = 0;
    const alvo = box.querySelector('.say-what');
    timerAnalise = setInterval(() => {
      i = (i+1) % FALAS_ANALISE.length;
      alvo.classList.add('swap');
      setTimeout(() => { alvo.textContent = FALAS_ANALISE[i]; alvo.classList.remove('swap'); }, 320);
    }, 2400);
  }

  /* ── cartões ─────────────────────────────────────────────────────── */
  function cartao(dados){
    const box = document.createElement('div');
    box.className = 'panel';

    if(dados.tipo === 'diagnostico'){
      const s = dados.segmento;
      box.innerHTML =
        cabecalho(s.icone, 'Diagnóstico inicial', s.nome) +
        '<div class="panel-body">' +
          s.problemas.map((p,i) => item('✓', p, i)).join('') +
        '</div>' +
        '<div class="panel-note">Situações que costumam aparecer nesse segmento. O que vale no seu caso, o Ryan confirma depois de analisar.</div>';
    }

    if(dados.tipo === 'modulos'){
      const s = dados.segmento;
      box.innerHTML =
        cabecalho('🧭', 'Caminhos possíveis', 'Por onde esse tipo de projeto costuma começar') +
        '<div class="panel-body">' +
          s.modulos.map((m,i) =>
            '<div class="module" style="animation-delay:' + (i*.1+.15).toFixed(2) + 's">' +
              '<div class="ic">' + m.i + '</div>' +
              '<div class="txt"><strong>' + U.escapar(m.t) + '</strong><span>' + U.escapar(m.d) + '</span></div>' +
            '</div>'
          ).join('') +
        '</div>' +
        '<div class="panel-note">Ponto de partida, não escopo fechado. O que entra de verdade sai da análise do Ryan.</div>';
    }

    if(dados.tipo === 'resumo'){
      box.innerHTML =
        cabecalho('📄', 'Resumo', 'O que eu entendi da nossa conversa') +
        '<div class="resumo">' + U.escapar(dados.texto) + '</div>';
    }

    if(dados.tipo === 'whatsapp'){
      box.className = 'turn ia';
      setTimeout(() => Avatar.gestoDirigido('aponta'), 420);   // olha pro botão
      box.innerHTML =
        '<a class="wa-btn" href="' + dados.url + '" target="_blank" rel="noopener" data-wa="1">' +
        ICONE_WA + 'Abrir conversa no WhatsApp</a>';
    }

    el.thread.appendChild(box);
    descer(true);
  }

  const cabecalho = (glifo, titulo, sub) =>
    '<div class="panel-head"><div class="glyph">' + glifo + '</div>' +
    '<div><h3>' + U.escapar(titulo) + '</h3><p>' + U.escapar(sub) + '</p></div></div>';

  const item = (marca, texto, i) =>
    '<div class="row-item" style="animation-delay:' + (i*.09+.15).toFixed(2) + 's">' +
    '<b>' + marca + '</b><span>' + U.escapar(texto) + '</span></div>';

  /* ── chips ───────────────────────────────────────────────────────── */
  function chips(lista){
    if(!lista || !lista.length){ el.chips.classList.add('hidden'); return; }
    el.chips.classList.remove('hidden');
    el.chips.innerHTML = lista.map(c =>
      '<button class="chip' + (c.destaque ? ' accent' : '') + '"' +
      ' data-diz="' + U.escapar(c.diz || '') + '"' +
      ' data-acao="' + U.escapar(c.acao || '') + '">' +
      '<em>' + c.icone + '</em> ' + U.escapar(c.rotulo) + '</button>'
    ).join('');
  }
  const limparChips = () => el.chips.classList.add('hidden');

  const status = txt => el.status.textContent = txt;

  return { el, turno, revelar, analise, cartao, chips, limparChips, status, descer };
})();


/* ╔═══════════════════════════════════════════════════════════════════╗
   ║  13 · AVATAR · rig do mascote                                      ║
   ╚═══════════════════════════════════════════════════════════════════╝ */
const Avatar = (() => {
  const BASE = { idle:'Disponível agora', listening:'Ouvindo você', thinking:'Analisando...', speaking:'Respondendo' };
  const HUMORES = ['happy','curious','celebrating','thanking','waving','cheering'];

  /** Repertório ocioso. Sorteado sem repetir o anterior — repetição
   *  é o que denuncia que existe um laço rodando ali atrás.        */
  /**
   * O roteiro do mascote. Em vez de um gesto solto de vez em quando,
   * ele encadeia cenas quase sem parar — é o que dá a sensação de
   * vídeo. A lista é embaralhada e consumida até o fim antes de
   * recomeçar: assim nenhuma cena repete perto da anterior.
   */
  const CENAS = [
    ['confere','aponta'],
    ['vira-e','vira-d'],
    ['digita'],
    ['holo','aponta'],
    ['escaneia'],
    ['balanca'],
    ['espreguica','ombros'],
    ['maos','dedos'],
    ['inclina','antenas'],
    ['saltita','mostra'],
    ['postura'],
    ['alonga','vira-d'],
    ['mostra','holo'],
    ['antenas','saltita']
  ];

  /** duração de cada gesto, em milissegundos */
  const DURACAO = { postura:2400, escaneia:3300, digita:3400, balanca:4600,
                    espreguica:2900, holo:2800, saltita:2700 };

  let fila = [];
  function proximaCena(){
    if(!fila.length){
      fila = CENAS.slice();
      for(let i = fila.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        const t = fila[i]; fila[i] = fila[j]; fila[j] = t;
      }
    }
    return fila.pop();
  }
  const body = document.body;
  const svg = U.$('avatar');
  const iris = svg.querySelector('.iris-g');
  const head = svg.querySelector('.head');

  const cena = document.documentElement;   // recebe --px / --py do cenário

  let base = 'idle', timerHumor = null, ponteiroAtivo = false, timerPonteiro = null, rafOlhar = null;
  let ultimoGesto = null;

  const olhar = (dx,dy) => iris.setAttribute('transform','translate(' + dx.toFixed(2) + ' ' + dy.toFixed(2) + ')');
  const inclinar = (g,px) => head.style.transform = 'rotate(' + g.toFixed(2) + 'deg) translateX(' + px.toFixed(2) + 'px)';
  const centro = () => { olhar(0,0); inclinar(0,0); };

  function setBase(prox){
    if(base === prox) return;
    Object.keys(BASE).forEach(s => body.classList.remove('is-'+s));
    base = prox;
    body.classList.add('is-'+prox);
    UI.status(BASE[prox]);
    if(prox === 'thinking'){ olhar(-2.4,-3.4); inclinar(-2.2,-1); }
    else if(prox === 'listening' && !ponteiroAtivo){ olhar(0, 4.4); inclinar(.8, 0); }
    else if(!ponteiroAtivo) centro();
  }

  function humor(nome, ms = 2200){
    if(U.reduzido) return;
    clearTimeout(timerHumor);
    HUMORES.forEach(h => body.classList.remove('is-'+h));
    body.classList.add('is-'+nome);
    timerHumor = setTimeout(() => body.classList.remove('is-'+nome), ms);
  }

  function seguir(x,y){
    ponteiroAtivo = true;
    clearTimeout(timerPonteiro);
    timerPonteiro = setTimeout(() => { ponteiroAtivo = false; if(base !== 'thinking') centro(); }, 2800);
    if(U.reduzido || base === 'thinking' || rafOlhar) return;
    rafOlhar = requestAnimationFrame(() => {
      rafOlhar = null;
      const r = svg.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height*0.4;
      const dx = Math.max(-1, Math.min(1, (x-cx)/(innerWidth*0.45)));
      const dy = Math.max(-1, Math.min(1, (y-cy)/(innerHeight*0.45)));
      olhar(dx*5.4, dy*3.4); inclinar(dx*3.2, dx*1.8);
      cena.style.setProperty('--px', dx.toFixed(3));
      cena.style.setProperty('--py', dy.toFixed(3));
    });
  }

  function piscar(){
    setTimeout(() => {
      if(U.reduzido){ piscar(); return; }        // dorme, mas não morre
      body.classList.add('is-blinking');
      setTimeout(() => body.classList.remove('is-blinking'), 108);
      if(Math.random() < .2) setTimeout(() => {
        body.classList.add('is-blinking');
        setTimeout(() => body.classList.remove('is-blinking'), 96);
      }, 240);
      piscar();
    }, 2300 + Math.random()*4300);
  }

  function desviar(){
    setTimeout(() => {
      if(U.reduzido){ desviar(); return; }
      if(!ponteiroAtivo && base === 'idle'){
        olhar((Math.random()-.5)*5.2, (Math.random()-.5)*3);
        setTimeout(centro, 1500);
      }
      desviar();
    }, 3200 + Math.random()*3600);
  }

  /** Um gesto por vez, sempre diferente do anterior. */
  function gesto(){
    if(U.reduzido) return;
    let g;
    do { g = GESTOS[Math.floor(Math.random()*GESTOS.length)]; } while(g === ultimoGesto);
    ultimoGesto = g;
    body.classList.add('ges-'+g);
    setTimeout(() => body.classList.remove('ges-'+g), g === 'postura' ? 2400 : 1800);
  }

  /**
   * Laço do palco. A pausa entre cenas é curta e irregular: o mascote
   * quase nunca fica parado, mas a cadência não vira metrônomo.
   */
  function palco(){
    const folga = U.vitrine ? 260 + Math.random()*700     // modo vitrine: quase sem pausa
                            : 900 + Math.random()*2100;
    setTimeout(() => {
      if(U.reduzido || base !== 'idle' || document.hidden) return palco();
      encenar(proximaCena(), 0, palco);
    }, folga);
  }

  /** Gesto pedido de fora: apontar para um botão, olhar para uma dica. */
  function gestoDirigido(nome, ms = 2600){
    if(U.reduzido) return;
    body.classList.add('ges-'+nome);
    setTimeout(() => body.classList.remove('ges-'+nome), ms);
  }

  /** Executa uma sequência, abortando se a conversa voltar a andar. */
  function encenar(passos, i, aoFim){
    if(U.reduzido || base !== 'idle' || i >= passos.length){ if(aoFim) aoFim(); return; }
    const g = passos[i];
    body.classList.add('ges-'+g);
    setTimeout(() => {
      body.classList.remove('ges-'+g);
      setTimeout(() => encenar(passos, i + 1, aoFim), 240);
    }, DURACAO[g] || 2000);
  }

  function iniciar(){
    body.classList.add('is-idle');
    UI.status(BASE.idle);
    piscar(); desviar(); palco();      // sempre ligados; quem cala é o U.reduzido
    addEventListener('pointermove', e => seguir(e.clientX, e.clientY), {passive:true});
    addEventListener('touchstart', e => e.touches[0] && seguir(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  }

  return { iniciar, setBase, humor, gesto, gestoDirigido, encenar };
})();


/* ╔═══════════════════════════════════════════════════════════════════╗
   ║  14 · ANALYTICS                                                   ║
   ╚═══════════════════════════════════════════════════════════════════╝ */
const Analytics = (() => {
  const sid = 'bh_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const inicio = Date.now();
  const marcos = new Set();
  let mensagens = 0;

  function evento(nome, dados = {}){
    const pacote = { sid, nome, t:Date.now()-inicio, ...dados };
    console.info('[bhsaas]', nome, dados);
    if(CFG.analytics){
      try{ navigator.sendBeacon(CFG.analytics, JSON.stringify(pacote)); }catch(e){}
    }
  }

  function marco(nome, dados){
    if(marcos.has(nome)) return;
    marcos.add(nome);
    evento(nome, dados);
  }

  const contarMensagem = () => { mensagens++; evento('mensagem', { total:mensagens }); };

  function encerrar(){
    evento('tempo_no_chat', {
      segundos: Math.round((Date.now()-inicio)/1000),
      mensagens,
      estado: Motor.ctx.estado,
      segmento: Motor.ctx.dados.segmento?.id || null
    });
  }

  return { evento, marco, contarMensagem, encerrar };
})();


/* ╔═══════════════════════════════════════════════════════════════════╗
   ║  15 · EVENTOS                                                     ║
   ╚═══════════════════════════════════════════════════════════════════╝ */
const Eventos = (() => {
  const el = UI.el;
  let ocupado = false, aberto = false, timerDigitando = null;

  /** Executa a saída do motor: fala, cartão, chip — nessa ordem. */
  async function apresentar(saida){
    for(const fala of saida.falas){
      await UI.revelar(fala, UI.turno('assistant',''));
      await U.espera(140);
    }
    for(const c of saida.cartoes){
      UI.cartao(c);
      await U.espera(240);
    }
    UI.chips(saida.chips);
  }

  async function enviar(bruto){
    const texto = (bruto ?? el.input.value).trim().slice(0, 1200);
    if(!texto || ocupado) return;

    if(!aberto){ aberto = true; document.body.classList.add('is-open'); Analytics.marco('primeira_mensagem'); }

    UI.limparChips();
    UI.turno('user', texto);
    Analytics.contarMensagem();

    el.input.value = '';
    el.input.style.height = 'auto';
    el.send.disabled = true;

    ocupado = true;
    Avatar.setBase('thinking');
    UI.analise(true);

    // pausa proporcional ao trabalho — sem isso a resposta instantânea
    // entrega que é um sistema de regras e quebra a naturalidade
    const { minPensando, maxPensando } = CFG.ritmo;
    await U.espera(U.reduzido ? 0 : minPensando + Math.random()*(maxPensando-minPensando));

    const saida = Motor.processar(texto);

    UI.analise(false);
    await apresentar(saida);

    ocupado = false;
    Avatar.setBase('idle');
    el.send.disabled = !el.input.value.trim();
  }

  async function acao(nome){
    if(ocupado) return;
    ocupado = true;
    UI.limparChips();
    Avatar.setBase('thinking');
    UI.analise(true);
    await U.espera(U.reduzido ? 0 : 600);
    const saida = Motor.acao(nome);
    UI.analise(false);
    await apresentar(saida);
    ocupado = false;
    Avatar.setBase('idle');
  }

  function aoDigitar(){
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, 132) + 'px';
    el.send.disabled = !el.input.value.trim() || ocupado;
    if(ocupado) return;
    Avatar.setBase('listening');
    clearTimeout(timerDigitando);
    timerDigitando = setTimeout(() => { if(!ocupado) Avatar.setBase('idle'); }, 2400);
  }

  function ligar(){
    el.send.addEventListener('click', () => enviar());
    el.input.addEventListener('input', aoDigitar);
    el.input.addEventListener('focus', () => { if(!ocupado) Avatar.setBase('listening'); });
    el.input.addEventListener('blur',  () => { if(!ocupado) Avatar.setBase('idle'); });
    el.input.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviar(); }
    });

    el.chips.addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if(!chip) return;
      UI.limparChips();
      if(chip.dataset.acao) return acao(chip.dataset.acao);
      if(chip.dataset.diz) return enviar(chip.dataset.diz);
    });

    el.thread.addEventListener('click', e => {
      if(e.target.closest('[data-wa]')) Analytics.marco('clicou_whatsapp');
    });

    addEventListener('beforeunload', () => Analytics.encerrar());
  }

  return { ligar, enviar, apresentar };
})();


/* ╔═══════════════════════════════════════════════════════════════════╗
   ║  16 · DICAS                                                       ║
   ║  O mascote fala sozinho de vez em quando. Vale mais como conteúdo ║
   ║  do que como enfeite: as dicas saem dos dados do segmento que já  ║
   ║  estavam no arquivo e nunca eram mostrados a ninguém.             ║
   ╚═══════════════════════════════════════════════════════════════════╝ */
const Dicas = (() => {
  const caixa = U.$('tip');
  const alvo  = caixa.querySelector('p');
  const waTop = U.$('waTop');
  const body  = document.body;

  const GERAIS = [
    'Me conta o seu ramo e eu já te mostro <b>o que costuma travar</b> nesse tipo de operação.',
    'Trabalho com <b>sistemas, sites, automações e integrações</b> — é só dizer do que você precisa.',
    'Pode escrever do seu jeito: eu entendo abreviação e não ligo para erro de digitação 😊',
    'Nada do que você escrever sai deste navegador. <b>Zero servidor.</b>',
    'Se preferir, use os atalhos abaixo do chat — é mais rápido que digitar.',
    'Posso montar um <b>resumo do seu projeto</b> no fim da conversa, pronto para enviar.'
  ];

  let visivel = false, ultima = null;

  /** Monta o repertório do momento a partir do que já sabemos. */
  function repertorio(){
    const seg = Motor.ctx.dados.segmento;
    const lista = [];
    if(seg){
      const ramo = seg.nome.toLowerCase();
      seg.automacoes.forEach(a => lista.push('Em ' + ramo + ', dá para automatizar <b>' + a + '</b>.'));
      seg.indicadores.forEach(i => lista.push('Um número que costuma faltar nesse ramo: <b>' + i + '</b>.'));
      seg.objetivos.forEach(o => lista.push('Quem trabalha com ' + ramo + ' geralmente quer <b>' + o + '</b>.'));
    } else {
      lista.push.apply(lista, GERAIS);
    }
    if(Motor.podeChamarRyan())
      lista.push('Quando quiser, eu monto o resumo e te levo direto ao <b>Ryan</b> no WhatsApp 👋');
    return lista;
  }

  const ocupado = () => body.classList.contains('is-thinking')
                     || body.classList.contains('is-speaking')
                     || body.classList.contains('is-listening');

  function mostrar(){
    const lista = repertorio();
    if(!lista.length) return;
    let dica, voltas = 0;
    do { dica = lista[Math.floor(Math.random()*lista.length)]; } while(dica === ultima && ++voltas < 6);
    ultima = dica;
    alvo.innerHTML = dica;
    caixa.classList.add('on');
    visivel = true;
    if(!U.reduzido) Avatar.gestoDirigido('dica');
    setTimeout(() => { caixa.classList.remove('on'); visivel = false; }, 7400);
  }

  /** O botão do topo só aparece quando o fluxo comercial libera. */
  function conferirWhats(){
    if(body.classList.contains('pode-whats')) return;
    if(!Motor.podeChamarRyan()) return;
    waTop.href = Motor.linkWhats();
    body.classList.add('pode-whats');
    Avatar.gestoDirigido('aponta');
  }

  function ciclo(){
    setTimeout(() => {
      conferirWhats();
      if(!U.reduzido && !ocupado() && !visivel) mostrar();
      ciclo();
    }, 9000 + Math.random()*7000);
  }

  /** Aviso específico: o robô está parado porque o sistema pediu. */
  function avisoMovimento(){
    alvo.innerHTML = 'Seu sistema está com <b>reduzir movimento</b> ligado, por isso eu estou parado 🙂'
                   + '<br>Toque em <b>Animação</b> aqui embaixo para me ver em ação.';
    caixa.classList.add('on');
    visivel = true;
    setTimeout(() => { caixa.classList.remove('on'); visivel = false; }, 11000);
  }

  function iniciar(){
    waTop.addEventListener('click', () => Analytics.marco('clicou_whatsapp_topo'));
    setTimeout(() => { if(!U.reduzido) mostrar(); }, 5400);
    ciclo();
  }

  return { iniciar, mostrar, conferirWhats, avisoMovimento };
})();


/* ╔═══════════════════════════════════════════════════════════════════╗
   ║  17 · MOVIMENTO                                                   ║
   ║  Um interruptor de verdade. A preferência do sistema continua      ║
   ║  sendo o padrão — mas deixou de ser uma sentença.                  ║
   ╚═══════════════════════════════════════════════════════════════════╝ */
const Movimento = (() => {
  const raiz = document.documentElement;
  const botao = U.$('animBtn');
  const rotulo = botao.querySelector('span');

  const ligado = () => raiz.classList.contains('anim-on');

  function aplicar(lig){
    raiz.classList.toggle('anim-on', lig);
    raiz.classList.toggle('anim-off', !lig);
    if(!lig){
      // corta na hora a cena que estava no ar, senão sobra um gesto solto
      [...document.body.classList].filter(c => c.indexOf('ges-') === 0)
        .forEach(c => document.body.classList.remove(c));
    }
    if(lig) raiz.classList.remove('anim-sistema');
    botao.setAttribute('aria-pressed', String(lig));
    rotulo.textContent = lig ? 'Animação ligada' : 'Animação desligada';
    Analytics.evento('movimento', { ligado:lig });
  }

  function iniciar(){
    aplicar(ligado());
    botao.addEventListener('click', () => aplicar(!ligado()));
    // se foi o sistema que desligou, o visitante precisa saber onde religar
    if(raiz.classList.contains('anim-sistema')) setTimeout(Dicas.avisoMovimento, 2400);
  }

  return { iniciar, aplicar, ligado };
})();


/* ╔═══════════════════════════════════════════════════════════════════╗
   ║  18 · INICIALIZAÇÃO                                               ║
   ╚═══════════════════════════════════════════════════════════════════╝ */
(function iniciar(){
  Avatar.iniciar();
  Eventos.ligar();
  Dicas.iniciar();
  Movimento.iniciar();
  Analytics.marco('abriu_chat');

  const passo = (fn, ms) => setTimeout(fn, U.reduzido ? 0 : ms);

  passo(() => document.body.classList.add('entered'), 260);
  passo(() => document.body.classList.add('lit'), 900);
  passo(() => Avatar.humor('waving', 2400), 1250);
  passo(async () => {
    await Eventos.apresentar({
      falas:[ Motor.saudacao() ],
      cartoes:[],
      chips: Motor.chipsSegmentos()
    });
    Avatar.setBase('idle');
  }, 1500);
})();
</script>
