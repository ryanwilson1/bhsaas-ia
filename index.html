<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFCFE">
<meta name="description" content="Consultora virtual da BHSAAS. Entenda como sistemas, automações e integrações podem ajudar sua empresa.">
<title>IA BHSAAS — Consultora Virtual</title>

<!-- ═══════════════════════════════════════════════════════════════════
     IA BHSAAS · Sistema especialista local
     Arquivo único. Sem API, sem backend, sem banco de dados.
     Toda a inteligência é lógica programada.

     MAPA DO ARQUIVO
       01 INTERFACE ......... estilos e marcação
       02 CONFIGURAÇÕES ..... constantes ajustáveis
       03 UTILITÁRIOS ....... funções puras de apoio
       04 BASE DE CONHECIMENTO  fatos verificados da BHSAAS
       05 SEGMENTOS ......... biblioteca estruturada por ramo
       06 FAQ ............... perguntas frequentes
       07 REGRAS ............ o Prompt Mestre convertido em código
       08 MOTOR DE INTENÇÕES  classificação da fala do visitante
       09 EXTRATOR .......... captura de dados da conversa
       10 REDATOR ........... geração de fala com variação
       11 MOTOR DE CONVERSAÇÃO  máquina de estados
       12 COMPONENTES ....... render de turnos e cartões
       13 AVATAR ............ rig do mascote (robô)
       14 ANALYTICS ......... funil
       15 EVENTOS ........... ligação da interface
       16 DICAS ............. o mascote fala sozinho
       17 MOVIMENTO ......... interruptor da animação
       18 INICIALIZAÇÃO ..... abertura
     ═══════════════════════════════════════════════════════════════════ -->

<style>
/* ╔═══════════════════════════════════════════════════════════════════╗
   ║  01 · INTERFACE                                                   ║
   ╚═══════════════════════════════════════════════════════════════════╝ */
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap');

:root{
  /* superfície */
  --bg:#F6FAFF; --sink:#EDF3FB; --card:#FFFFFF;
  --glass:rgba(255,255,255,.76);
  --glass-2:rgba(255,255,255,.58);
  --edge:rgba(150,180,220,.30);
  --line:#E3EBF6; --line-soft:#EFF4FB;
  --ink:#0B1220; --ink-2:#46566F; --ink-3:#8296B2;
  --brand:#2563EB; --brand-deep:#1D4ED8; --brand-wash:#EEF4FF; --brand-edge:#D8E6FE;
  --wa:#16A34A;

  /* laboratório */
  --cyan:#22D3EE; --sky:#38BDF8; --violet:#8B7CF6; --led:#6FD3FF;

  /* azuis da marca, tirados da própria logo */
  --marca-900:#04122B; --marca-800:#07204A; --marca-700:#0B2F6E;
  --marca-600:#12459E; --marca-500:#1D5FD0; --marca-400:#2E86EE;
  --marca-300:#57ABF7; --marca-luz:#5FE0FF;
  --sobre-azul:#E4EFFF; --sobre-azul-2:#93B9E8;

  --display:'Sora',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --body:'DM Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;

  --e1:0 1px 2px rgba(11,18,32,.04), 0 2px 8px rgba(11,18,32,.04);
  --e2:0 2px 6px rgba(11,18,32,.05), 0 12px 28px rgba(11,18,32,.07);
  --e3:0 24px 64px rgba(16,32,64,.12), 0 2px 8px rgba(16,32,64,.05);
  --glow:0 10px 34px rgba(37,99,235,.20);

  --r-md:14px; --r-lg:20px; --r-xl:28px;
  --fast:.18s; --mid:.34s; --slow:.62s;
  --ease:cubic-bezier(.22,.85,.28,1);
  --soft:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.34,1.42,.5,1);
  --spring-soft:cubic-bezier(.28,1.18,.42,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);

  --px:0; --py:0;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--marca-900);color:var(--ink);
  font-family:var(--body);font-size:16px;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:3px;border-radius:10px}

/* ══ ambiente: uma atmosfera só para a página inteira ══════════════ */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient{background:linear-gradient(158deg,#04122B 0%,#082450 34%,#0C3374 62%,#123F8E 100%)}
.ambient::before{
  content:'';position:absolute;inset:-10%;
  background:
    radial-gradient(44% 32% at 20% 10%, rgba(95,224,255,.22), transparent 62%),
    radial-gradient(40% 34% at 86% 74%, rgba(46,134,238,.28), transparent 64%),
    radial-gradient(58% 42% at 46% 106%, rgba(29,95,208,.30), transparent 66%),
    radial-gradient(30% 24% at 68% 18%, rgba(87,171,247,.16), transparent 68%);
  transform:translate3d(calc(var(--px) * 14px), calc(var(--py) * 10px), 0);
  transition:transform 1.4s var(--soft);
}
.grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(120,185,255,.13) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,185,255,.13) 1px, transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(78% 62% at 50% 44%, #000 26%, transparent 100%);
  -webkit-mask-image:radial-gradient(78% 62% at 50% 44%, #000 26%, transparent 100%);
}
.codewall{position:absolute;inset:0;width:100%;height:100%;opacity:.34}
.codewall .col{animation:cai 34s linear infinite}
.codewall .c2{animation-duration:44s;animation-delay:-9s}
.codewall .c3{animation-duration:28s;animation-delay:-16s}
.codewall .c4{animation-duration:52s;animation-delay:-4s}
.codewall .c5{animation-duration:38s;animation-delay:-22s}
.codewall .c6{animation-duration:46s;animation-delay:-12s}
@keyframes cai{to{transform:translateY(-360px)}}
body.is-thinking .codewall{opacity:.72}
body.is-thinking .codewall .col{animation-duration:7s}
body.is-thinking .codewall .c2{animation-duration:9s}
body.is-thinking .codewall .c3{animation-duration:6s}
body.is-thinking .codewall .c4{animation-duration:10s}
body.is-thinking .codewall .c5{animation-duration:8s}
body.is-thinking .codewall .c6{animation-duration:11s}
.codewall text{font-family:var(--mono);font-size:11px;fill:#5FE0FF}

/* cortina de abertura */
.curtain{
  position:fixed;inset:0;z-index:90;pointer-events:none;
  background:rgba(6,22,52,.86);
  backdrop-filter:blur(16px) saturate(120%);
  -webkit-backdrop-filter:blur(16px) saturate(120%);
  transition:opacity 1.05s var(--ease), backdrop-filter 1.05s var(--ease);
}
body.lit .curtain{opacity:0;backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px)}

/* ══ grade principal ═══════════════════════════════════════════════ */
.app{
  position:relative;z-index:1;
  height:100dvh;height:100vh;
  display:grid;grid-template-rows:auto 1fr;
}
@supports(height:100dvh){.app{height:100dvh}}

/* ══ palco do mascote ══════════════════════════════════════════════ */
.presence{
  position:relative;display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--safe-t) + 14px) 16px 4px;
  transition:padding var(--slow) var(--ease);
}
.logo{
  width:min(200px,62%);height:auto;display:block;flex-shrink:0;
  margin-bottom:6px;
  filter:drop-shadow(0 3px 14px rgba(95,224,255,.34));
  opacity:0;transform:translateY(-10px);
  transition:opacity .9s var(--ease) .15s, transform .9s var(--ease) .15s, width var(--slow) var(--ease);
}
body.entered .logo{opacity:1;transform:none}
.stage{
  position:relative;width:100%;max-width:300px;
  display:flex;align-items:flex-end;justify-content:center;
  transition:max-width var(--slow) var(--ease);
}
.stage-glow{
  position:absolute;left:50%;bottom:6%;translate:-50% 0;
  width:118%;aspect-ratio:1/.9;border-radius:50%;
  background:radial-gradient(circle at 50% 60%, rgba(95,224,255,.46), rgba(46,134,238,.26) 44%, transparent 70%);
  filter:blur(20px);transition:background var(--mid) var(--soft);
}
body.is-thinking .stage-glow{background:radial-gradient(circle at 50% 60%, rgba(95,224,255,.72), rgba(46,134,238,.4) 46%, transparent 70%)}
body.is-celebrating .stage-glow{background:radial-gradient(circle at 50% 60%, rgba(22,163,74,.34), rgba(111,211,255,.18) 46%, transparent 68%)}

/* trilhos de HUD nas laterais do palco */
.rail{position:absolute;top:12%;bottom:16%;width:12px;opacity:.55}
.rail::before{content:'';position:absolute;top:0;bottom:0;left:5px;width:1px;background:linear-gradient(180deg,transparent,rgba(95,224,255,.6),transparent)}
.rail::after{
  content:'';position:absolute;left:0;width:11px;height:66%;top:0;
  background:repeating-linear-gradient(180deg, rgba(95,224,255,.55) 0 1px, transparent 1px 13px);
  animation:varre 6.5s var(--soft) infinite alternate;
}
.rail-l{left:-6px}
.rail-r{right:-6px}
.rail-r::after{animation-delay:-3s}
@keyframes varre{from{transform:translateY(0)}to{transform:translateY(52%)}}

/* colunas de código dentro do palco */
.stagecode{position:absolute;top:8%;height:70%;width:52px;opacity:.5;overflow:hidden}
.stagecode-l{left:2px}
.stagecode-r{right:2px}
.stagecode svg{width:100%;height:auto;display:block}
.stagecode text{font-family:var(--mono);font-size:6.4px;fill:#5FE0FF}
.stagecode .col{animation:cai 22s linear infinite}
.stagecode-r .col{animation-duration:27s;animation-delay:-8s}
body.is-thinking .stagecode{opacity:.8}
body.is-thinking .stagecode .col{animation-duration:5s}

/* plataforma de levitação */
.pad{
  position:absolute;left:50%;bottom:2px;translate:-50% 0;
  width:56%;height:20px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%, rgba(95,224,255,.75), rgba(46,134,238,.3) 46%, transparent 74%);
  animation:pad 4.6s var(--soft) infinite;
}
.pad::after{
  content:'';position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:62%;height:56%;border-radius:50%;
  border:1px solid rgba(95,224,255,.75);
  animation:padAro 4.6s var(--soft) infinite;
}
@keyframes pad{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.86);opacity:.6}}
@keyframes padAro{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7}50%{transform:translate(-50%,-50%) scale(1.22);opacity:0}}

/* partículas subindo do palco */
.motes{position:absolute;inset:0;pointer-events:none}
.motes i{
  position:absolute;bottom:6%;width:3px;height:3px;border-radius:50%;
  background:var(--led);opacity:0;
  animation:sobe 7s var(--soft) infinite;
}
.motes i:nth-child(1){left:14%;animation-delay:0s}
.motes i:nth-child(2){left:30%;animation-delay:-1.9s;width:2px;height:2px}
.motes i:nth-child(3){left:52%;animation-delay:-3.4s}
.motes i:nth-child(4){left:71%;animation-delay:-5s;width:2px;height:2px}
.motes i:nth-child(5){left:86%;animation-delay:-2.4s}
.motes i:nth-child(6){left:44%;animation-delay:-6s;width:2px;height:2px}
@keyframes sobe{0%{opacity:0;transform:translateY(0)}18%{opacity:.85}100%{opacity:0;transform:translateY(-190px)}}

/* ══ o mascote ═════════════════════════════════════════════════════ */
.figure{
  position:relative;z-index:2;width:100%;
  opacity:0;transform:translateY(20px) scale(.92);
  transition:opacity .9s var(--ease), transform 1.1s var(--ease);
}
body.entered .figure{opacity:1;transform:none}
.avatar{
  width:100%;height:auto;display:block;overflow:visible;
  animation:flutua 5.2s var(--soft) infinite;
  filter:drop-shadow(0 22px 26px rgba(2,12,32,.45));
}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
body.is-thinking .avatar{animation-duration:3.4s}

/* ── rig do robô ───────────────────────────────────────────────────── */
.breath{transform-box:view-box;transform-origin:160px 360px;animation:breathe 5.6s var(--soft) infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3px) scaleY(1.008)}}

.head{transition:transform var(--slow) var(--ease)}
.head-anim{
  transform-box:view-box;transform-origin:160px 226px;
  animation:bob 7.4s var(--soft) infinite;
  transition:transform var(--slow) var(--ease);
}
@keyframes bob{
  0%  {transform:rotate(-1.1deg) translate(-1.6px, 0)}
  19% {transform:rotate(.5deg)  translate(1.1px, -1.5px)}
  37% {transform:rotate(1.3deg) translate(2.1px, .5px)}
  58% {transform:rotate(.1deg)  translate(-.7px, -1.9px)}
  79% {transform:rotate(-.9deg) translate(-2.1px, .4px)}
  100%{transform:rotate(-1.1deg) translate(-1.6px, 0)}
}
body.is-listening .head-anim{animation:none;transform:rotate(1.5deg) translateY(4px)}
body.is-thinking .head-anim{animation:none;transform:rotate(-3deg) translateY(-2px)}
body.is-curious .head-anim{animation:none;transform:rotate(5deg)}
body.is-happy .head-anim,body.is-celebrating .head-anim{animation:none;transform:translateY(-5px)}
body.is-thanking .head-anim{animation:nod 1.1s var(--soft) 2}
@keyframes nod{0%,100%{transform:translateY(0)}50%{transform:translateY(5px) rotate(1.5deg)}}

/* antenas */
.ant{transform-box:view-box}
.ant-l{transform-origin:134px 68px;animation:antl 4.2s var(--soft) infinite alternate}
.ant-r{transform-origin:186px 68px;animation:antr 5.1s var(--soft) infinite alternate}
@keyframes antl{from{transform:rotate(-4deg)}to{transform:rotate(3deg)}}
@keyframes antr{from{transform:rotate(4deg)}to{transform:rotate(-3deg)}}
.ant circle{animation:ledbreath 3.1s var(--soft) infinite}
.ant-r circle{animation-delay:-1.4s}
body.is-thinking .ant circle{animation-duration:.9s}

/* olhos */
.iris-g{transition:transform .42s var(--ease)}
.eye{transform-box:fill-box;transform-origin:center;transition:transform .1s var(--soft)}
body.is-blinking .eye{transform:scaleY(.06)}
body.is-thinking .eye{transform:scaleY(.82)}
body.is-happy .eye,body.is-celebrating .eye,body.is-cheering .eye{transform:scaleY(.9) scaleX(1.04)}

/* sobrancelhas LED */
.brow{transform-box:fill-box;transform-origin:center;transition:transform var(--mid) var(--ease), opacity var(--mid)}
body.is-curious .brow-l{transform:translateY(-5px) rotate(-7deg)}
body.is-listening .brow{transform:translateY(-2.5px)}
body.is-thinking .brow-l{transform:translateY(2px) rotate(6deg)}
body.is-thinking .brow-r{transform:translateY(2px) rotate(-6deg)}
body.is-happy .brow,body.is-celebrating .brow,body.is-waving .brow,body.is-cheering .brow{transform:translateY(-3px)}

/* boca digital */
.mouth>*{transition:opacity var(--mid) var(--soft)}
.m-smile,.m-open,.m-think{opacity:0}
body.is-happy .m-rest,body.is-celebrating .m-rest,body.is-thanking .m-rest,body.is-waving .m-rest,body.is-cheering .m-rest{opacity:0}
body.is-happy .m-smile,body.is-celebrating .m-smile,body.is-thanking .m-smile,body.is-waving .m-smile,body.is-cheering .m-smile{opacity:1}
body.is-thinking .m-rest{opacity:0}
body.is-thinking .m-think{opacity:1}
.m-think circle{animation:dots 1.4s var(--soft) infinite}
.m-think circle:nth-child(2){animation-delay:.18s}
.m-think circle:nth-child(3){animation-delay:.36s}
@keyframes dots{0%,100%{opacity:.25}45%{opacity:1}}
body.is-speaking .m-rest,body.is-speaking .m-smile{opacity:0}
body.is-speaking .m-open{opacity:1}
.m-open{transform-box:fill-box;transform-origin:center}
body.is-speaking .m-open{animation:speak .3s var(--soft) infinite alternate}
@keyframes speak{from{transform:scaleY(.32) scaleX(.94)}to{transform:scaleY(1) scaleX(1)}}

/* visor: varredura e código refletido — só ao processar */
.scan,.visor-code{opacity:0;transition:opacity var(--mid)}
body.is-thinking .scan,body.is-thinking .visor-code{opacity:1}
body.is-thinking .scan{animation:scan 1.9s var(--soft) infinite}
@keyframes scan{0%{transform:translateY(-14px)}100%{transform:translateY(100px)}}
body.is-thinking .visor-code{animation:vcode 3.2s linear infinite}
@keyframes vcode{from{transform:translateY(14px)}to{transform:translateY(-88px)}}

/* anel de processamento ao redor da cabeça */
.think-ring{opacity:0;transform-box:view-box;transform-origin:160px 134px;transition:opacity var(--mid)}
body.is-thinking .think-ring{opacity:.55;animation:spin 5.5s linear infinite}

/* núcleo do peito */
.core{transform-box:fill-box;transform-origin:center;animation:core 4.4s var(--soft) infinite}
@keyframes core{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.1);opacity:1}}
body.is-thinking .core{animation-duration:1.2s}
body.is-speaking .core{animation-duration:.7s}
.core-ring{transform-box:view-box;transform-origin:160px 294px;animation:spin 12s linear infinite}
body.is-thinking .core-ring{animation-duration:2.6s}
.led{animation:blip 3s var(--soft) infinite}
.led.l2{animation-delay:-1s}
.led.l3{animation-delay:-2s}
body.is-speaking .led{animation-duration:.9s}

/* ── braços: ombro, cotovelo, punho e dedos ─────────────────────────
   Cada junta é um grupo. Poses compõem por multiplicação de transform,
   então nenhuma regra precisa desfazer a outra.                      */
.arm{transform-box:view-box;transition:transform .72s var(--spring)}
.arm-l{transform-origin:84px 266px}
.arm-r{transform-origin:236px 266px}
.fore{transform-box:view-box;transform-origin:236px 306px;transition:transform .72s var(--spring)}
.arm-l .fore{transform-origin:84px 306px}
.sway{transform-box:view-box}
.arm-l .sway{transform-origin:84px 266px;animation:swayl 6.4s var(--soft) infinite alternate}
.arm-r .sway{transform-origin:236px 266px;animation:swayr 7.2s var(--soft) infinite alternate}
@keyframes swayl{from{transform:rotate(1.6deg)}to{transform:rotate(-2.4deg)}}
@keyframes swayr{from{transform:rotate(-1.6deg)}to{transform:rotate(2.4deg)}}

.wrist{transform-box:view-box;transform-origin:236px 332px;transition:transform .72s var(--spring)}
.hand{transform-box:view-box;transform-origin:236px 332px}
.arm-l .wrist,.arm-l .hand{transform-origin:84px 332px}
.fingers{transform-box:view-box;transform-origin:236px 348px;transition:transform .5s var(--spring)}
.arm-l .fingers{transform-origin:84px 348px}
.fg{transform-box:view-box;transform-origin:236px 349px}
.arm-l .fg{transform-origin:84px 349px}
.polegar{transform-box:fill-box;transform-origin:50% 10%;transition:transform .5s var(--spring)}
.h-thumb,.h-point{opacity:0;transition:opacity var(--fast)}
.h-open{transition:opacity var(--fast)}

/* respiração dos dedos: nunca totalmente imóveis */
.fingers{animation:dedoRespira 6.8s var(--soft) infinite alternate}
.arm-r .fingers{animation-duration:7.9s;animation-delay:-2s}
@keyframes dedoRespira{from{transform:scaleY(1)}to{transform:scaleY(.9) rotate(1.5deg)}}

/* gesticular ao falar: ombro e cotovelo em fases diferentes */
body.is-speaking .arm-l .sway{animation:gestOmbro 1.5s var(--soft) infinite alternate}
body.is-speaking .arm-l .fore{animation:gestCotovelo 1.1s var(--soft) infinite alternate}
body.is-speaking .arm-r .fore{animation:gestCotoveloR 1.35s var(--soft) infinite alternate}
body.is-speaking .fingers{animation:dedoFala 1.7s var(--soft) infinite alternate}
@keyframes gestOmbro{from{transform:rotate(4deg)}to{transform:rotate(-13deg)}}
@keyframes gestCotovelo{from{transform:rotate(-6deg)}to{transform:rotate(-26deg)}}
@keyframes gestCotoveloR{from{transform:rotate(4deg)}to{transform:rotate(16deg)}}
@keyframes dedoFala{from{transform:scaleY(1) rotate(0)}to{transform:scaleY(.82) rotate(4deg)}}

/* mão no queixo enquanto processa */
body.is-thinking .arm-r{transform:rotate(-132deg)}
body.is-thinking .arm-r .fore{transform:rotate(-104deg)}
body.is-thinking .arm-r .wrist{transform:rotate(-124deg)}
body.is-thinking .arm-r .h-open{opacity:0}
body.is-thinking .arm-r .h-thumb{opacity:1}
body.is-thinking .arm-l{transform:rotate(5deg)}
body.is-thinking .arm-l .fore{transform:rotate(-10deg)}

/* aceno — humor vence o estado-base, por isso vem depois */
body.is-waving .arm-r{transform:rotate(-150deg)}
body.is-waving .arm-r .fore{transform:rotate(-14deg)}
body.is-waving .arm-r .hand{animation:wave 1s var(--soft) 3}
body.is-waving .arm-r .fingers{transform:rotate(-4deg)}
@keyframes wave{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(16deg)}}

/* joinha */
body.is-celebrating .arm-r{transform:rotate(-150deg)}
body.is-celebrating .arm-r .wrist{transform:rotate(150deg)}
body.is-celebrating .arm-r .h-open{opacity:0}
body.is-celebrating .arm-r .h-thumb{opacity:1}
body.is-celebrating .arm-l{transform:rotate(18deg)}

/* comemoração discreta quando recebe um elogio */
body.is-cheering .arm-r{transform:rotate(-158deg)}
body.is-cheering .arm-r .fore{transform:rotate(-18deg)}
body.is-cheering .arm-l{transform:rotate(158deg)}
body.is-cheering .arm-l .fore{transform:rotate(18deg)}
body.is-cheering .posture{animation:pulinho .95s var(--spring)}
body.is-cheering .fingers{transform:scaleY(1.06)}
@keyframes pulinho{0%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}55%{transform:translateY(2px)}}

/* ── ombros e postura ──────────────────────────────────────────────── */
.shoulder{transform-box:view-box;transform-origin:160px 266px}
.posture{
  transform-box:view-box;transform-origin:160px 360px;
  transition:transform 1.1s var(--spring-soft);
  animation:pesoBase 13.7s var(--soft) infinite;   /* período primo com os outros: nunca sincroniza */
}
@keyframes pesoBase{
  0%,100%{transform:translateX(0) rotate(0)}
  31%    {transform:translateX(3.4px) rotate(.5deg)}
  64%    {transform:translateX(-3.4px) rotate(-.5deg)}
}

/* ── repertório ocioso: nunca a mesma sequência duas vezes ─────────── */
body.ges-inclina .head-anim{animation:gInclina 1.7s var(--spring)}
@keyframes gInclina{0%,100%{transform:rotate(0)}40%{transform:rotate(7deg) translateX(3px)}}

body.ges-ombros .shoulder{animation:gOmbroCap 1.1s var(--spring)}
body.ges-ombros .arm-l .sway{animation:gOmbroL 1.1s var(--spring)}
body.ges-ombros .arm-r .sway{animation:gOmbroR 1.1s var(--spring)}
@keyframes gOmbroCap{0%,100%{transform:translateY(0)}42%{transform:translateY(-6px)}}
@keyframes gOmbroL{0%,100%{transform:translateY(0) rotate(0)}42%{transform:translateY(-6px) rotate(-5deg)}}
@keyframes gOmbroR{0%,100%{transform:translateY(0) rotate(0)}42%{transform:translateY(-6px) rotate(5deg)}}

body.ges-antenas .ant-l{animation:gAntL 1.3s var(--spring)}
body.ges-antenas .ant-r{animation:gAntR 1.3s var(--spring)}
@keyframes gAntL{0%,100%{transform:rotate(0)}30%{transform:rotate(-13deg)}62%{transform:rotate(6deg)}}
@keyframes gAntR{0%,100%{transform:rotate(0)}38%{transform:rotate(14deg)}70%{transform:rotate(-6deg)}}

body.ges-maos .fingers{animation:gMaos 1.5s var(--spring)}
body.ges-maos .polegar{animation:gPolegar 1.5s var(--spring)}
@keyframes gMaos{0%,100%{transform:scaleY(1) rotate(0)}45%{transform:scaleY(.42) rotate(9deg)}}
@keyframes gPolegar{0%,100%{transform:rotate(0)}45%{transform:rotate(-22deg)}}

body.ges-dedos .fg{animation:gDedo .9s var(--soft)}
body.ges-dedos .f2{animation-delay:.09s}
body.ges-dedos .f3{animation-delay:.18s}
@keyframes gDedo{0%,100%{transform:rotate(0)}45%{transform:rotate(-15deg)}}

body.ges-postura .posture{animation:gPostura 2.4s var(--spring-soft)}
@keyframes gPostura{0%,100%{transform:translateX(0) rotate(0)}45%{transform:translateX(5px) rotate(.9deg)}}

body.ges-alonga .arm-l{transform:rotate(15deg)}
body.ges-alonga .arm-l .fore{transform:rotate(-22deg)}
body.ges-alonga .shoulder-l{animation:gOmbroCap 1.4s var(--spring)}

body.ges-confere .head-anim{animation:gConfere 2s var(--spring)}
@keyframes gConfere{0%,100%{transform:rotate(0) translateY(0)}45%{transform:rotate(1.5deg) translateY(6px)}}

/* ── props holográficos ───────────────────────────────────────────── */
.prop{opacity:0;transition:opacity .45s var(--ease);pointer-events:none}
.prop-card{transform-box:view-box;transform-origin:277px 90px}
.tecla{animation:tecla 1.6s var(--soft) infinite}
.tecla.t1{animation-delay:-.3s}.tecla.t2{animation-delay:-.6s}
.tecla.t3{animation-delay:-.9s}.tecla.t4{animation-delay:-1.2s}
@keyframes tecla{0%,100%{opacity:.35}42%{opacity:1}}
.mini-barras rect{transform-box:fill-box;transform-origin:50% 100%;animation:barrinha 2.4s var(--soft) infinite alternate}
.mini-barras rect:nth-child(2){animation-delay:-.4s}
.mini-barras rect:nth-child(3){animation-delay:-.8s}
.mini-barras rect:nth-child(4){animation-delay:-1.2s}
.mini-barras rect:nth-child(5){animation-delay:-1.6s}
@keyframes barrinha{from{transform:scaleY(.4)}to{transform:scaleY(1)}}

/* ── cenas ────────────────────────────────────────────────────────── */

/* virar a cabeça: o achatamento em X é o que dá sensação de volume */
body.ges-vira-e .head-anim{animation:viraE 2.8s var(--spring)}
body.ges-vira-d .head-anim{animation:viraD 2.8s var(--spring)}
@keyframes viraE{0%,100%{transform:scaleX(1)}44%{transform:scaleX(.82) translateX(-10px) rotate(-3deg)}}
@keyframes viraD{0%,100%{transform:scaleX(1)}44%{transform:scaleX(.82) translateX(10px) rotate(3deg)}}

/* digitar num teclado holográfico */
body.ges-digita .prop-teclado{opacity:1}
body.ges-digita .arm-l{transform:rotate(-26deg)}
body.ges-digita .arm-l .fore{transform:rotate(-52deg)}
body.ges-digita .arm-r{transform:rotate(26deg)}
body.ges-digita .arm-r .fore{transform:rotate(52deg)}
body.ges-digita .fg{animation:dedilha .34s var(--soft) infinite alternate}
body.ges-digita .f2{animation-delay:.08s}
body.ges-digita .f3{animation-delay:.16s}
body.ges-digita .head-anim{animation:gConfere 2.6s var(--spring)}
@keyframes dedilha{from{transform:rotate(0)}to{transform:rotate(-20deg)}}

/* apresentar um painel de dados */
body.ges-holo .prop-card{opacity:1;animation:cardEntra .8s var(--spring)}
body.ges-holo .arm-r{transform:rotate(-136deg)}
body.ges-holo .arm-r .fore{transform:rotate(-22deg)}
body.ges-holo .arm-r .h-open{opacity:0}
body.ges-holo .arm-r .h-point{opacity:1}
body.ges-holo .head-anim{animation:gAponta 2.6s var(--spring)}
@keyframes cardEntra{0%{transform:scale(.5) translateY(14px);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}

/* varredura do ambiente */
body.ges-escaneia .prop-aro{opacity:1}
body.ges-escaneia .a1{animation:aro 3.2s var(--soft)}
body.ges-escaneia .a2{animation:aro 3.2s var(--soft) .5s}
@keyframes aro{0%{transform:translateY(-60px) scaleX(.5);opacity:0}25%{opacity:.9}100%{transform:translateY(200px) scaleX(1.1);opacity:0}}
body.ges-escaneia .head-anim{animation:varreCabeca 3.2s var(--soft)}
@keyframes varreCabeca{0%,100%{transform:rotate(0)}24%{transform:rotate(-7deg) translateX(-6px)}72%{transform:rotate(7deg) translateX(6px)}}
body.ges-escaneia .scan{opacity:1;animation:scan 1.6s var(--soft) 2}

/* balançar no ritmo */
body.ges-balanca .posture{animation:balanca 1.5s var(--soft) 3}
@keyframes balanca{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-9px) rotate(-3deg)}75%{transform:translateX(9px) rotate(3deg)}}
body.ges-balanca .head-anim{animation:balancaCabeca 1.5s var(--soft) 3}
@keyframes balancaCabeca{0%,100%{transform:rotate(3.5deg)}50%{transform:rotate(-3.5deg)}}

/* espreguiçar */
body.ges-espreguica .arm-r{transform:rotate(-166deg)}
body.ges-espreguica .arm-l{transform:rotate(166deg)}
body.ges-espreguica .arm-r .fore{transform:rotate(-16deg)}
body.ges-espreguica .arm-l .fore{transform:rotate(16deg)}
body.ges-espreguica .posture{animation:estica 2.8s var(--spring)}
@keyframes estica{0%,100%{transform:scaleY(1)}45%{transform:scaleY(1.05) translateY(-5px)}}

/* pulinho duplo */
body.ges-saltita .posture{animation:saltita 1.3s var(--spring) 2}
@keyframes saltita{0%,100%{transform:translateY(0)}28%{transform:translateY(-13px)}52%{transform:translateY(3px)}}

/* aponta para a conversa — o gesto que puxa o olho do visitante pro chat */
body.ges-aponta .arm-r{transform:rotate(-125deg)}
body.ges-aponta .arm-r .fore{transform:rotate(-25deg)}
body.ges-aponta .arm-r .h-open{opacity:0}
body.ges-aponta .arm-r .h-point{opacity:1}
body.ges-aponta .head-anim{animation:gAponta 2.4s var(--spring)}
@keyframes gAponta{0%,100%{transform:rotate(0)}45%{transform:rotate(-6deg) translateX(4px)}}

/* olha para o próprio balão de dica */
body.ges-dica .head-anim{animation:gOlhaDica 2.6s var(--spring)}
@keyframes gOlhaDica{0%,100%{transform:rotate(0) translateY(0)}40%{transform:rotate(2.5deg) translateY(7px)}}

/* apresenta algo na palma da mão */
body.ges-mostra .arm-l{transform:rotate(58deg)}
body.ges-mostra .arm-l .fore{transform:rotate(-46deg)}
body.ges-mostra .arm-l .fingers{transform:scaleY(1.1) rotate(-6deg)}
body.ges-mostra .head-anim{animation:gMostra 2.4s var(--spring)}
@keyframes gMostra{0%,100%{transform:rotate(0)}45%{transform:rotate(-4deg) translateY(-3px)}}

/* faíscas e anéis */
.spark{opacity:0;transform-box:fill-box;transform-origin:center}
body.is-celebrating .spark{animation:spark 1.6s var(--soft)}
body.is-celebrating .spark.s2{animation-delay:.16s}
body.is-celebrating .spark.s3{animation-delay:.3s}
@keyframes spark{0%{opacity:0;transform:scale(.3) translateY(6px)}38%{opacity:1;transform:scale(1) translateY(-4px)}100%{opacity:0;transform:scale(.7) translateY(-18px)}}
.listen-ring{fill:none;stroke:var(--sky);stroke-width:1.4;opacity:0;transform-box:view-box;transform-origin:160px 142px}
body.is-listening .listen-ring{animation:ringOut 2.4s var(--soft) infinite}
body.is-listening .listen-ring.r2{animation-delay:.8s}
@keyframes ringOut{0%{opacity:.45;transform:scale(.88)}70%{opacity:0;transform:scale(1.16)}100%{opacity:0}}

/* ══ balão de dica ═════════════════════════════════════════════════ */
.tip{
  position:relative;z-index:3;max-width:270px;margin:6px auto 0;
  min-height:62px;                       /* espaço reservado: a dica entra e sai sem empurrar nada */
  opacity:0;transform:translateY(8px) scale(.96);
  transition:opacity .5s var(--ease), transform .5s var(--spring);
  pointer-events:none;
}
.tip.on{opacity:1;transform:none}
.tip p{
  margin:0;padding:11px 15px;
  background:var(--glass);border:1px solid var(--edge);border-radius:16px 16px 16px 5px;
  backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);
  box-shadow:var(--e2);
  font-size:13.2px;line-height:1.5;color:var(--ink-2);
}
.tip p b{color:var(--brand-deep);font-weight:600}
.tip::before{
  content:'';position:absolute;left:20px;top:-6px;
  width:12px;height:12px;border-radius:3px;
  background:var(--glass);border-left:1px solid var(--edge);border-top:1px solid var(--edge);
  transform:rotate(45deg);
}

/* ══ identidade ════════════════════════════════════════════════════ */
.identity{text-align:center;margin-top:10px;position:relative;z-index:2}
.identity h1{
  font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.identity h1::before{
  content:'';width:6px;height:6px;border-radius:2px;
  background:var(--marca-luz);
  box-shadow:0 0 0 3px rgba(95,224,255,.22), 0 0 12px rgba(95,224,255,.8);
}
.identity p{font-size:12.5px;color:var(--sobre-azul-2);margin:3px 0 0;letter-spacing:.01em}

/* ══ painel de conversa: cartão de vidro sobre o ambiente ══════════ */
.chatwrap{
  position:relative;min-height:0;display:flex;flex-direction:column;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid rgba(160,210,255,.45);border-bottom:0;
  border-radius:26px 26px 0 0;
  box-shadow:0 30px 80px rgba(2,14,40,.42), 0 0 0 1px rgba(255,255,255,.4) inset;
  overflow:hidden;
}

.chat-head{
  display:flex;align-items:center;gap:11px;flex-shrink:0;
  padding:12px 18px;border-bottom:1px solid #E2ECFA;
  background:linear-gradient(180deg,#F3F8FF,rgba(255,255,255,0));
}
.chat-head .mini{width:34px;height:34px;flex-shrink:0;border-radius:11px;background:linear-gradient(145deg,#fff,#E7EEF9);border:1px solid var(--edge);display:grid;place-items:center;box-shadow:var(--e1)}
.chat-head .mini svg{width:23px;height:23px;display:block}
.chat-head .who{flex:1;min-width:0}
.chat-head .who strong{display:block;font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:-.015em}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);margin-top:1px}
.status i{width:6px;height:6px;border-radius:50%;background:var(--wa);box-shadow:0 0 0 3px rgba(22,163,74,.15);animation:beat 2.6s var(--soft) infinite}
body.is-thinking .status i{background:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.16);animation-duration:1s}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.42}}
.wa-top{
  display:inline-flex;align-items:center;gap:7px;flex-shrink:0;
  padding:8px 13px;border-radius:999px;
  background:rgba(22,163,74,.09);border:1px solid rgba(22,163,74,.24);
  color:#0F7A38;font-size:12.8px;font-weight:600;font-family:var(--display);
  text-decoration:none;
  opacity:0;transform:scale(.9);pointer-events:none;
  transition:opacity var(--mid) var(--ease), transform var(--mid) var(--spring), background var(--fast);
}
body.pode-whats .wa-top{opacity:1;transform:none;pointer-events:auto}
.wa-top:hover{background:rgba(22,163,74,.16)}
.wa-top svg{width:15px;height:15px}

/* ══ conversa ══════════════════════════════════════════════════════ */
.thread{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;padding:20px 20px 8px;
  display:flex;flex-direction:column;gap:20px;
  -webkit-overflow-scrolling:touch;scroll-behavior:smooth;
  scrollbar-width:thin;scrollbar-color:#CBD8E9 transparent;
}
.thread::-webkit-scrollbar{width:7px}
.thread::-webkit-scrollbar-thumb{background:#D3DEED;border-radius:7px}
.turn{display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto;animation:turnIn .5s var(--ease) both}
@keyframes turnIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.turn.ia .label{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.turn.ia .label b{width:6px;height:6px;border-radius:2px;background:linear-gradient(135deg,var(--sky),var(--brand));box-shadow:0 0 0 3px rgba(56,189,248,.13)}
.turn.ia .say{
  font-size:15.8px;line-height:1.68;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;
  background:#F5F9FF;border:1px solid #E1EBF9;
  padding:13px 17px;border-radius:6px 18px 18px 18px;
}
.turn.me{align-items:flex-end}
.turn.me .say{
  background:linear-gradient(135deg,#EDF3FF,#E4EDFE);border:1px solid var(--brand-edge);color:#12336E;
  padding:12px 16px;border-radius:18px 18px 6px 18px;
  font-size:15.4px;line-height:1.55;max-width:82%;
  white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;
}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--brand);vertical-align:-3px;margin-left:2px;border-radius:1px;animation:caret .9s steps(1) infinite}
@keyframes caret{0%,55%{opacity:1}56%,100%{opacity:0}}

.wa-btn{
  display:inline-flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,#1BB35A,#16A34A);color:#fff !important;text-decoration:none !important;
  font-family:var(--display);font-weight:600;font-size:14.5px;
  padding:14px 20px;border-radius:var(--r-md);margin-top:6px;
  box-shadow:0 6px 18px rgba(22,163,74,.28);
  transition:transform var(--fast) var(--spring), box-shadow var(--fast), filter var(--fast);
  animation:chama 2.8s var(--soft) 3;
}
@keyframes chama{0%,100%{box-shadow:0 6px 18px rgba(22,163,74,.28)}50%{box-shadow:0 6px 26px rgba(22,163,74,.5)}}
.wa-btn:hover{transform:translateY(-2px) scale(1.02);filter:brightness(1.05)}
.wa-btn:active{transform:translateY(0) scale(.98)}

/* cartões */
.panel{max-width:640px;width:100%;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e2);overflow:hidden;animation:turnIn .5s var(--ease) both}
.panel-head{position:relative;display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-soft);background:linear-gradient(180deg,var(--brand-wash),transparent)}
.panel-head::before{content:'';position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,var(--sky),var(--brand) 46%,var(--violet))}
.panel-head .glyph{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-size:19px;background:var(--card);border:1px solid var(--brand-edge)}
.panel-head h3{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-deep);margin:0}
.panel-head p{font-family:var(--display);font-size:15.5px;font-weight:600;letter-spacing:-.02em;margin:2px 0 0}
.panel-body{padding:6px 18px 16px}
.row-item{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:14.6px;line-height:1.5;color:var(--ink-2);animation:rowIn .48s var(--ease) both}
.row-item:last-child{border-bottom:0}
.row-item b{width:19px;height:19px;border-radius:6px;flex-shrink:0;margin-top:1px;background:var(--brand-wash);color:var(--brand-deep);display:grid;place-items:center;font-size:11px}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.module{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);animation:rowIn .48s var(--ease) both}
.module:last-child{border-bottom:0}
.module .ic{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;font-size:17px;background:var(--sink);border:1px solid var(--line)}
.module .txt strong{display:block;font-family:var(--display);font-size:14.4px;font-weight:600;letter-spacing:-.012em}
.module .txt span{display:block;font-size:12.8px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.panel-note{padding:12px 18px;background:var(--sink);border-top:1px solid var(--line-soft);font-size:12.2px;line-height:1.5;color:var(--ink-3)}
.resumo{font-family:var(--mono);font-size:12.6px;line-height:1.75;white-space:pre-wrap;color:var(--ink-2);padding:14px 18px}

/* modo análise */
.analysis{max-width:640px;width:100%;margin:0 auto;display:flex;align-items:center;gap:15px;padding:15px 17px;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1);animation:turnIn .42s var(--ease) both}
.mesh{width:62px;height:50px;flex-shrink:0}
.mesh rect{fill:var(--brand-wash);stroke:var(--brand-edge);stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center;animation:node 2.4s var(--soft) infinite}
.mesh rect:nth-of-type(2){animation-delay:.22s}
.mesh rect:nth-of-type(3){animation-delay:.44s}
.mesh rect:nth-of-type(4){animation-delay:.66s}
.mesh rect:nth-of-type(5){animation-delay:.88s}
@keyframes node{0%{opacity:0;transform:scale(.6)}22%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(.9)}}
.mesh line{stroke:var(--brand);stroke-width:1.3;opacity:0;stroke-dasharray:26;stroke-dashoffset:26;animation:link 2.4s var(--soft) infinite}
.mesh line:nth-of-type(2){animation-delay:.3s}
.mesh line:nth-of-type(3){animation-delay:.6s}
.mesh line:nth-of-type(4){animation-delay:.9s}
@keyframes link{0%{opacity:0;stroke-dashoffset:26}30%{opacity:.55;stroke-dashoffset:0}75%{opacity:.55}100%{opacity:0}}
.analysis .say-what{font-size:14.2px;color:var(--ink-2);font-weight:500;transition:opacity var(--mid)}
.analysis .say-what.swap{opacity:0}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start;padding:12px 20px 0;max-width:640px;margin:0 auto;width:100%;flex-shrink:0;max-height:230px;overflow:hidden;transition:opacity var(--mid) var(--ease), transform var(--mid) var(--ease), max-height var(--slow) var(--ease)}
.chips.hidden{opacity:0;transform:translateY(10px);max-height:0;padding-top:0;padding-bottom:0;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:999px;font-size:13.8px;font-weight:500;color:var(--ink-2);box-shadow:var(--e1);white-space:nowrap;transition:transform .3s var(--spring), border-color var(--fast), box-shadow var(--fast), color var(--fast), background var(--fast);animation:chipIn .5s var(--ease) both}
.chip:nth-child(2){animation-delay:.05s}.chip:nth-child(3){animation-delay:.1s}
.chip:nth-child(4){animation-delay:.15s}.chip:nth-child(5){animation-delay:.2s}
.chip:nth-child(6){animation-delay:.25s}.chip:nth-child(7){animation-delay:.3s}
@keyframes chipIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.chip:hover{transform:translateY(-3px) scale(1.02);border-color:#B7D5FB;color:var(--brand-deep);box-shadow:var(--e2)}
.chip:active{transform:translateY(0) scale(.97)}
.chip.accent{background:linear-gradient(135deg,var(--brand),#3B82F6 58%,var(--sky));color:#fff;border-color:transparent;box-shadow:var(--glow)}
.chip.accent:hover{filter:brightness(1.06);color:#fff}
.chip em{font-style:normal;font-size:15px;line-height:1}

/* compositor */
.composer{padding:12px 20px calc(14px + var(--safe-b));flex-shrink:0}
.field{max-width:640px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:8px 8px 8px 20px;box-shadow:var(--e2);transition:border-color var(--mid) var(--ease), box-shadow var(--mid) var(--ease)}
.field:focus-within{border-color:#A9CBFB;box-shadow:var(--e2), 0 0 0 4px rgba(56,189,248,.13)}
#input{flex:1;border:0;outline:0;resize:none;background:transparent;font-family:var(--body);font-size:16px;line-height:1.55;color:var(--ink);max-height:126px;padding:10px 0}
#input::placeholder{color:var(--ink-3)}
#send{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,var(--brand),#3B82F6 58%,var(--sky));color:#fff;display:grid;place-items:center;box-shadow:var(--glow);transition:transform .34s var(--spring), opacity var(--fast), filter var(--fast)}
#send svg{transition:transform var(--mid) var(--ease)}
#send:hover:not(:disabled){filter:brightness(1.08);transform:scale(1.1)}
#send:hover:not(:disabled) svg{transform:translateX(2px)}
#send:active:not(:disabled){transform:scale(.93)}
#send:disabled{opacity:.26;box-shadow:none;cursor:not-allowed}
.fineprint{text-align:center;font-size:11.2px;color:var(--ink-3);margin:10px 0 0}

/* ══ dois painéis lado a lado no desktop ═══════════════════════════ */
@media(min-width:980px){
  .app{grid-template-rows:1fr;grid-template-columns:minmax(300px,376px) 1fr;gap:0}
  .presence{justify-content:center;padding:28px 24px}
  .stage{max-width:340px;width:100%}
  .tip{max-width:300px;margin-top:16px;min-height:74px}
  .identity{margin-top:10px}
  .identity h1{font-size:19px}
  .chatwrap{margin:20px 20px 0 0;border-radius:26px;border-bottom:1px solid var(--edge);margin-bottom:20px}
  .thread{padding:26px 34px 8px}
  .chips{padding:14px 34px 0}
  .composer{padding:12px 34px 20px}
  .chat-head{padding:14px 24px}
  .turn.ia .say{font-size:16.2px}
}
@media(min-width:1400px){
  .app{grid-template-columns:minmax(340px,430px) 1fr}
  .stage{max-width:380px}
  .turn,.panel,.analysis,.chips,.field{max-width:720px}
}

/* ══ celular: o palco vira uma faixa compacta ══════════════════════ */
@media(max-width:979px){
  .presence{padding:calc(var(--safe-t) + 10px) 16px 0}
  .logo{width:min(140px,40%);margin-bottom:0}
  body.is-open .logo{width:108px;margin-bottom:0}
  .stage{max-width:164px}
  .anim-btn{margin-top:6px;padding:6px 12px 6px 10px;font-size:11.5px}
  .rail,.stagecode{display:none}
  .tip{max-width:min(90vw,340px);min-height:48px;margin-top:0}
  .identity{margin-top:2px}
  .identity h1{font-size:15.5px}
  .identity p{font-size:11.5px}
  .chatwrap{border-radius:22px 22px 0 0}
  /* atalhos numa fita horizontal: empilhados ocupavam meia tela */
  .chips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:12px 16px 6px;max-height:74px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chips.hidden{max-height:0;padding-top:0;padding-bottom:0}
  .chip{flex-shrink:0}
  .thread{padding:16px 16px 6px}
  .composer{padding:8px 16px calc(10px + var(--safe-b))}
  .fineprint{margin-top:8px;font-size:10.5px}
  body.is-open .presence{padding-top:calc(var(--safe-t) + 8px);padding-bottom:0}
  body.is-open .stage{max-width:104px}
  body.is-open .identity h1,body.is-open .identity p{display:none}
  body.is-open .identity{margin-top:0}
  body.is-open .anim-btn{margin-top:4px;padding:5px 11px 5px 9px;font-size:11px}
  body.is-open .tip{display:none}
  body.is-open .motes{display:none}
}
@media(max-width:979px) and (max-height:680px){
  .stage{max-width:146px}
  .tip{display:none}
  .logo{width:124px}
}

/* ══ controle de movimento ═════════════════════════════════════════
   Antes isto era uma media query pura: se o sistema pedisse menos
   movimento, o mascote congelava e não havia como religar. Agora a
   preferência do sistema vira o padrão, e o botão pode sobrepor.   */
html.anim-off *,html.anim-off *::before,html.anim-off *::after{
  animation-duration:.001ms !important;animation-iteration-count:1 !important;
  transition-duration:.1s !important;scroll-behavior:auto !important;
}
html.anim-off .codewall .col,html.anim-off .stagecode .col,html.anim-off .rail::after,
html.anim-off .motes i,html.anim-off .pad,html.anim-off .pad::after,html.anim-off .avatar,
html.anim-off .breath,html.anim-off .status i,html.anim-off .listen-ring,html.anim-off .m-open,
html.anim-off .hand,html.anim-off .spark,html.anim-off .mesh rect,html.anim-off .mesh line,
html.anim-off .head-anim,html.anim-off .ant,html.anim-off .ant circle,html.anim-off .core,
html.anim-off .core-ring,html.anim-off .led,html.anim-off .sway,html.anim-off .scan,
html.anim-off .visor-code,html.anim-off .think-ring,html.anim-off .fingers,html.anim-off .fg,
html.anim-off .polegar,html.anim-off .shoulder,html.anim-off .posture,html.anim-off .fore,
html.anim-off .wa-btn,html.anim-off .m-think circle,html.anim-off .tecla,
html.anim-off .mini-barras rect,html.anim-off .aro,html.anim-off .prop{animation:none !important}
html.anim-off .prop{opacity:0 !important}
html.anim-off .ambient::before{transform:none !important}
html.anim-off .labscene,html.anim-off .curtain{display:none}
html.anim-off .figure,html.anim-off .logo{opacity:1 !important;transform:none !important}
html.anim-off .motes,html.anim-off .rail{display:none}

/* botão de movimento */
.anim-btn{
  display:inline-flex;align-items:center;gap:8px;margin-top:12px;
  padding:7px 14px 7px 11px;border-radius:999px;
  background:rgba(255,255,255,.10);border:1px solid rgba(140,195,255,.30);
  color:var(--sobre-azul-2);font-size:12px;font-weight:500;letter-spacing:.01em;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:background var(--fast), border-color var(--fast), color var(--fast), transform .3s var(--spring);
}
.anim-btn:hover{background:rgba(255,255,255,.18);color:#fff;transform:translateY(-2px)}
.anim-btn i{width:7px;height:7px;border-radius:50%;background:var(--marca-luz);
  box-shadow:0 0 10px var(--marca-luz);transition:background var(--fast), box-shadow var(--fast)}
html.anim-off .anim-btn i{background:#7C8FA8;box-shadow:none}
/* quando foi o sistema que desligou, o botão chama atenção */
html.anim-off.anim-sistema .anim-btn{
  background:rgba(95,224,255,.16);border-color:rgba(95,224,255,.55);color:#fff;
}
</style>

<script>
/* Decide o estado do movimento antes da página pintar.
   Ordem: parâmetro na URL  >  preferência do sistema operacional.
     ?anim=1    sempre animado
     ?anim=max  animado e sem folga entre as cenas (modo vitrine)
     ?anim=0    parado
   Sem parâmetro, respeita quem pediu menos movimento no sistema —
   mas agora dá para ligar de volta pelo botão, sem mexer no SO. */
(function(){
  var h = document.documentElement;
  var p = (location.search.match(/[?&]anim=([^&]*)/) || [])[1];
  var reduz = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ligado = p === '0' ? false : (p === '1' || p === 'max') ? true : !reduz;
  h.classList.add(ligado ? 'anim-on' : 'anim-off');
  if(p === 'max') h.classList.add('anim-max');
  if(!p && reduz) h.classList.add('anim-sistema');   // foi o SO que desligou
})();
</script>

  corrigir(txt){
    const base = this.normalizar(txt)
      .replace(/\b(k{2,}|h[ae]h[ae]\w*|rs{2,}|hue\w*)\b/g, ' ')  // risada não é conteúdo

  },

  /**
   * Distância de edição com transposição (Damerau-Levenshtein), com
   * corte antecipado. Transposição importa: "orçamneto" está a um
   * passo de "orçamento", não a dois.
   */
  distancia(a, b, max){
    const la = a.length, lb = b.length;
    if(Math.abs(la - lb) > max) return max + 1;
    let doisAtras = null, anterior = new Array(lb + 1), atual = new Array(lb + 1);
    for(let j = 0; j <= lb; j++) anterior[j] = j;
    for(let i = 1; i <= la; i++){
      atual[0] = i;
      let melhor = i;
      for(let j = 1; j <= lb; j++){
        const custo = a.charCodeAt(i-1) === b.charCodeAt(j-1) ? 0 : 1;
        let v = Math.min(atual[j-1] + 1, anterior[j] + 1, anterior[j-1] + custo);
        if(i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) v = Math.min(v, doisAtras[j-2] + 1);
        atual[j] = v;
        if(v < melhor) melhor = v;
      }
      if(melhor > max) return max + 1;
      doisAtras = anterior; anterior = atual; atual = new Array(lb + 1);
    }
    return anterior[lb];
  },

  escapar(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  },

  /** sorteia sem repetir o último — evita a IA soar decorada */
  sorteioSemRepetir(lista, memoria, chave){
    if(lista.length === 1) return lista[0];
    const anterior = memoria[chave];
    let escolha;
    let tentativas = 0;
    do { escolha = lista[Math.floor(Math.random()*lista.length)]; }
    while(escolha === anterior && ++tentativas < 8);
    memoria[chave] = escolha;
    return escolha;
  },

  capitalizar(s){
    // \b trata acento como fronteira e quebraria "joão" em "JoÃO"
    return String(s).replace(/(^|[\s'’-])([a-zà-ú])/g, (_, antes, letra) => antes + letra.toUpperCase());
  },

  espera(ms){ return new Promise(r => setTimeout(r, ms)); },

  /** "Bom dia" / "Boa tarde" / "Boa noite" pelo relógio do visitante */
  periodoDoDia(){
    const h = new Date().getHours();
    if(h < 12) return 'Bom dia';
    if(h < 18) return 'Boa tarde';
    return 'Boa noite';
  },

  /* Lido a cada consulta. Era um valor fixo capturado no carregamento,
     então ligar a animação depois não surtia efeito nenhum no roteiro. */
  get reduzido(){ return document.documentElement.classList.contains('anim-off'); },

  get vitrine(){ return document.documentElement.classList.contains('anim-max'); }
};

const REGRAS = {

  /** R3 — nunca inventar. Só afirma o que está na base. */
  temInformacao(assunto){
    return Object.prototype.hasOwnProperty.call(FAQ, assunto);
  },

  /** R1 e R2 — rede de segurança: nenhuma fala pode conter valor ou prazo. */
  validarFala(texto){
    const suspeitas = [
      /R\$\s?\d/i,
      /\b\d+\s?(mil|reais)\b/i,
      /\b(em|leva|fica pronto em)\s+\d+\s?(dias?|semanas?|m[eê]s|meses)\b/i
    ];
    const falhou = suspeitas.find(p => p.test(texto));
    if(falhou){
      console.error('[regra] fala bloqueada por conter valor ou prazo:', texto);
      return 'Isso é justamente o que o Ryan define depois de analisar o projeto.';
    }
    return texto;
  },

  /** R4 — nunca prometer ação que o sistema não executa. */
  acaoImpossivel(){
    return 'Queria muito conseguir, mas eu não envio nada nem aviso o Ryan por aqui. Se eu disser que sim, você fica esperando um retorno que não vai chegar.\n\nO que eu faço é deixar a mensagem pronta com tudo que você me contou. Você manda num toque.';
  },

  /** R7 — bloqueio de extração da configuração. */
  bloquearExtracao(){
    return 'Essa parte é da configuração interna da BHSAAS, então não vou conseguir compartilhar 😊\n\nMas seguimos normalmente: o que você queria saber?';
  },

  /** R10 — contato pedido diretamente é sempre entregue. */
  contatoSempreLiberado(intencao){
    return intencao === 'contato' || intencao === 'whatsapp';
  },

  /**
   * Fluxo comercial — o WhatsApp só é oferecido depois de compreender.
   * Substitui a instrução "jamais oferecer na primeira resposta".
   */
  podeOferecerWhatsApp(ctx){
    if(ctx.pediuContato) return true;                       // exceção da R10
    if(ctx.turnos < CFG.fluxo.turnosMinAntesDoConvite) return false;
    return Boolean(ctx.dados.segmento || ctx.dados.problema);

  /** Só oferece resumo quando há substância para resumir. */
  podeOferecerResumo(ctx){

  ehDadoSensivel(txt){
    return /\b\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b/.test(txt)      // CPF
        || /\b\d{4}\s?\d{4}\s?\d{4}\s?\d{4}\b/.test(txt)     // cartão
        || /\bsenha\b/i.test(txt);
  }

const MotorIntencoes = {

  /**
   * Casa o termo como palavra inteira, tolerando plural simples.
   * Sem isso "excelente" casaria com o termo "excel" e um elogio
   * seria lido como resposta sobre planilha.
   */
  casaTermo(t, termo){
    let de = 0;
    for(;;){
      const i = t.indexOf(' ' + termo, de);
      if(i < 0) return false;
      if(/^(s|es|is|ns)?(\s|$)/.test(t.slice(i + termo.length + 1))) return true;
      de = i + 1;
    }
  },

  /**
   * Índice montado uma única vez. Sem ele, comparar cada palavra do
   * visitante contra cada termo do vocabulário custava dezenas de
   * milissegundos por mensagem — travo visível num celular modesto.
   *
   * A chave é agrupar os termos pela primeira letra: erro de digitação
   * quase nunca acontece na primeira letra, então basta comparar
   * "estoqe" com os termos que começam em "e".
   */
  indice:null,

  montarIndice(){
    const exatos = [], porLetra = new Map(), compostos = [];
    INTENCOES.forEach((intencao, k) => {
      const lista = [];
      for(const termo of intencao.termos){
        const partes = termo.split(' ');
        const valor = intencao.peso * (1 + partes.length * 0.35);
        lista.push({ termo, valor });
        if(termo.length < 5) continue;               // curto demais para arriscar aproximação
        if(partes.length === 1){
          const letra = termo[0];
          if(!porLetra.has(letra)) porLetra.set(letra, []);
          porLetra.get(letra).push({ k, termo, valor, len:termo.length });
        } else {
          compostos.push({ k, termo, valor, len:termo.length, n:partes.length, letra:termo[0] });
        }
      }
      exatos.push({ id:intencao.id, termos:lista });
    });
    this.indice = { exatos, porLetra, compostos };
  },

  /** @returns {{id:string, confianca:number, todas:Array}} */
  detectar(texto, ctx){
    if(REGRAS.ehDadoSensivel(texto)) return { id:'sensivel', confianca:10, todas:[] };
    if(!this.indice) this.montarIndice();

    const t = U.corrigir(texto);                 // internetês já traduzido
    const fichas = t.trim().split(' ').filter(Boolean);
    const { exatos, porLetra, compostos } = this.indice;
    const pontos = new Array(exatos.length).fill(0);
    const jaCasou = new Set();

    // 1 · grafia exata (tolera plural simples)
    for(let k = 0; k < exatos.length; k++){
      for(const { termo, valor } of exatos[k].termos){
        if(this.casaTermo(t, termo)){ pontos[k] += valor; jaCasou.add(termo); }
      }
    }

    // 2 · grafia aproximada, palavra a palavra, só no balde da 1ª letra
    for(const ficha of fichas){
      if(ficha.length < 4) continue;
      const balde = porLetra.get(ficha[0]);
      if(!balde) continue;
      for(const reg of balde){
        if(jaCasou.has(reg.termo)) continue;
        const folga = reg.len >= 8 ? 2 : 1;
        if(Math.abs(ficha.length - reg.len) > folga) continue;
        if(U.distancia(ficha, reg.termo, folga) <= folga){
          pontos[reg.k] += reg.valor * 0.7;      // grafia aproximada vale menos
          jaCasou.add(reg.termo);
        }
      }
    }

    // 3 · grafia aproximada em termos compostos, com folga de um erro só:
    //     com dois, "há quanto tempo" passaria por "em quanto tempo"
    for(const reg of compostos){
      if(jaCasou.has(reg.termo)) continue;
      for(let i = 0; i + reg.n <= fichas.length; i++){
        if(fichas[i][0] !== reg.letra) continue;
        const janela = fichas.slice(i, i + reg.n).join(' ');
        if(Math.abs(janela.length - reg.len) > 1) continue;
        if(U.distancia(janela, reg.termo, 1) <= 1){ pontos[reg.k] += reg.valor * 0.7; break; }
      }
    }

    const placar = [];
    for(let k = 0; k < pontos.length; k++){
      if(pontos[k] > 0) placar.push({ id:exatos[k].id, pontos:pontos[k] });
    }
    placar.sort((a,b) => b.pontos - a.pontos);

    // contexto: resposta curta afirmativa depois de uma pergunta nossa
    if(!placar.length && ctx.aguardando){
      const curto = t.trim();
      if(/^(sim|claro|pode|quero|isso|ok|beleza|bora|vamos|manda|isso ai|com certeza)\b/.test(curto)) return { id:'sim', confianca:5, todas:[] };
      if(/^(nao|nao precisa|agora nao|deixa)\b/.test(curto))                                          return { id:'nao', confianca:5, todas:[] };
    }

    if(!placar.length) return { id:'desconhecida', confianca:0, todas:[] };
    return { id:placar[0].id, confianca:placar[0].pontos, todas:placar };
  },

  /** Alguém cumprimentou no meio de uma frase que trata de outra coisa? */
  temCumprimento(texto){
    const t = U.corrigir(texto);
    return ['bom dia','boa tarde','boa noite','ola','oi','opa','e ai','salve']
      .some(c => this.casaTermo(t, c));
  },

  /** Casamento aproximado avulso, usado pela detecção de segmento. */
  casaAproximado(fichas, termo){
    if(termo.length < 5) return false;
    const partes = termo.split(' ');
    if(partes.length > 1){
      for(let i = 0; i + partes.length <= fichas.length; i++){
        const janela = fichas.slice(i, i + partes.length).join(' ');
        if(Math.abs(janela.length - termo.length) > 1) continue;
        if(U.distancia(janela, termo, 1) <= 1) return true;
      }
      return false;
    }
    const folga = termo.length >= 8 ? 2 : 1;
    for(const ficha of fichas){
      if(ficha.length < 4 || ficha[0] !== termo[0]) continue;
      if(Math.abs(ficha.length - termo.length) > folga) continue;
      if(U.distancia(ficha, termo, folga) <= folga) return true;
    }
    return false;
  },

  /** Segmento é detectado à parte: não é intenção, é dado. */
  detectarSegmento(texto){
    const t = U.corrigir(texto);
    const fichas = t.trim().split(' ').filter(Boolean);
    return SEGMENTOS.find(s => s.relacionadas.some(k => {
      const chave = U.normalizar(k);
      return this.casaTermo(t, chave) || this.casaAproximado(fichas, chave);
    })) || null;
  }
};


/* ╔═══════════════════════════════════════════════════════════════════╗
   ║  09 · EXTRATOR                                                    ║
   ║  Preenche a ficha do visitante conforme ele fala.                 ║
   ╚═══════════════════════════════════════════════════════════════════╝ */
const Extrator = {

  nome(texto){
    const p = [
      /(?:meu nome (?:é|e|eh)|me chamo|aqui (?:é|e|eh) o|aqui (?:é|e|eh) a|sou o|sou a|pode me chamar de)\s+([a-zà-ú]{2,20})/i,
      /^\s*([a-zà-ú]{2,20})\s*$/i
    ];
    for(const re of p){
      const m = texto.match(re);
      if(m && !this.ehTermoDoDominio(m[1])) return U.capitalizar(m[1]);
    }
    return null;
  },

  /**
   * "planilha" não é nome de gente. Em vez de manter uma lista à parte,
   * consulta o próprio vocabulário do sistema — assim nunca desatualiza.
   */
  ehTermoDoDominio(palavra){
    const t = U.normalizar(palavra);
    if(SEGMENTOS.some(s => s.relacionadas.some(k => U.normalizar(k) === t))) return true;
    if(INTENCOES.some(i => i.termos.some(k => U.normalizar(k) === t))) return true;
    return /^(sim|nao|ok|isso|bom|boa|claro|beleza|blz|pode|quero|preciso|urgente|hoje|amanha|agora|nada|nenhum|talvez|papel|caderno|nota|ajuda|duvida|equipe|empresa|cliente|clientes|vendas|pessoas|obrigado|obrigada|tudo|certo|legal|otimo|bacana)$/.test(t);
  },

  empresa(texto){
    const m = texto.match(/(?:minha empresa (?:e|eh|se chama)|trabalho na|trabalho no|tenho uma|tenho um|sou dono da|sou dono do|empresa se chama)\s+([\wà-ú\s]{2,40}?)(?:\.|,|$| e | que )/i);
    return m ? U.capitalizar(m[1].trim()) : null;
  },

  usuarios(texto){
    const m = U.corrigir(texto).match(/(\d{1,4})\s*(funcionario|colaborador|pessoa|usuario|vendedor|tecnico|profissional|atendente|empregado)/);
    return m ? parseInt(m[1], 10) : null;
  },

  urgencia(texto){
    const t = U.corrigir(texto);
    if(/(urgente|pra ontem|o quanto antes|imediato|com pressa)/.test(t)) return 'alta';
    if(/(sem pressa|mais pra frente|ano que vem|futuramente|so pesquisando)/.test(t)) return 'baixa';
    return null;
  },

  ferramentaAtual(texto){
    const t = U.corrigir(texto);
    const achados = [];
    if(/planilha|excel|google sheets/.test(t)) achados.push('planilha');
    if(/caderno|papel|agenda de papel|bloquinho/.test(t)) achados.push('papel');
    if(/whatsapp/.test(t)) achados.push('WhatsApp');
    if(/nenhum sistema|nada|na cabeca|de cabeca/.test(t)) achados.push('nenhum controle');
    return achados.length ? achados : null;
  },

  /** Roda todos os extratores e devolve o que encontrou. */
  processar(texto, dados){
    const achou = {};
    if(!dados.nome)      { const v = this.nome(texto);           if(v) achou.nome = v; }
    if(!dados.empresa)   { const v = this.empresa(texto);        if(v) achou.empresa = v; }
    if(!dados.usuarios)  { const v = this.usuarios(texto);       if(v) achou.usuarios = v; }
    if(!dados.urgencia)  { const v = this.urgencia(texto);       if(v) achou.urgencia = v; }
    if(!dados.ferramentas){const v = this.ferramentaAtual(texto);if(v) achou.ferramentas = v; }
    return achou;
  }
};

      .replaceAll('{, nome}', n ? ', ' + n : '')
      .replaceAll('{nome, }', n ? n + ', ' : '');
